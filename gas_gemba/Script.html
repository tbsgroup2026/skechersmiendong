    function viewImage(url) { document.getElementById('viewerImage').src = url; openModal('imageViewerModal'); }

    function compactInfoBox(label, value) {
        return '<div class="info-item"><div class="info-label">' + esc(label) + '</div><div class="info-value">' + esc(value) + '</div></div>';
    }

    function renderAfterImagesBlock(list) {
        if (!list || !list.length) return '<span class="text-muted">Không có ảnh</span>';
        return '<div style="display:flex;gap:8px;flex-wrap:wrap">'
            + list.map(function (u) { return '<img src="' + esc(driveThumb(u, 150)) + '" class="after-thumb" onclick=\'viewImage(' + jsq(u) + ')\' loading="lazy">'; }).join('')
            + '</div>';
    }

    function renderDetailAfter(g) {
        var c = document.getElementById('detailAfterContainer'); if (!c) return;
        var me = String(APP.user.username || '').toLowerCase();
        var assignee = String(g.assigneeUsername || '').toLowerCase();
        var canManage = APP.permissions && APP.permissions.canManage;
        var status = g.status || '';
        var isCompleted = status === 'Hoàn thành';
        var isRejected = status === 'Từ chối';
        var isReopen = status === 'Chờ xử lý lại';
        var isProcessing = status === 'Đang xử lý' || status === 'Quá hạn';
        var isNew = status === 'Mới';
        var canEdit = !isCompleted && !isRejected && (assignee === me || canManage);
        var afterImgs = splitUrls(g.imagesAfter);

        if (isCompleted) {
            c.innerHTML = '<div class="info-item"><div class="info-label"><i class="fas fa-clipboard-check"></i> Kết quả thực hiện</div><div class="info-value detail-rich-text">' + esc(g.result || '—') + '</div></div>'
                + '<div class="detail-info-grid mt-2">' + compactInfoBox('Hoàn thành lúc', formatDate(g.completedAt) || '—') + compactInfoBox('Thời gian xử lý', (g.processHours || 0) + ' giờ') + '</div>'
                + '<div class="info-item mt-2"><div class="info-label"><i class="fas fa-images"></i> Ảnh After</div><div class="info-value">' + renderAfterImagesBlock(afterImgs) + '</div></div>';
            return;
        }

        if (isRejected) {
            c.innerHTML = '<div class="info-item"><div class="info-label"><i class="fas fa-ban"></i> Lý do từ chối</div><div class="info-value" style="color:#e25b5b">' + esc(g.rejectReason || 'Phiếu đã bị từ chối') + '</div></div>';
            return;
        }

        if (isReopen) {
            var rawReason = String(g.rejectReason || '').replace(/^\[Chờ xử lý lại\]\s*/i, '').trim();
            c.innerHTML = '<div class="info-item" style="background:#fff0f0;border-color:rgba(192,57,43,.18)"><div class="info-label" style="color:#c0392b"><i class="fas fa-redo"></i> Lý do yêu cầu xử lý lại</div><div class="info-value" style="color:#c0392b;font-weight:700">' + esc(rawReason || '(Không ghi lý do)') + '</div></div>'
                + (afterImgs.length ? '<div class="info-item mt-2"><div class="info-label" style="color:#94a3b8"><i class="fas fa-images"></i> Ảnh After lần trước (tham khảo)</div><div class="info-value" style="opacity:.65">' + renderAfterImagesBlock(afterImgs) + '</div></div>' : '')
                + (canEdit
                    ? '<div class="info-item mt-2" style="background:#fff8f0;border-color:#f0d090"><div class="info-label" style="color:#c97a1a"><i class="fas fa-play-circle"></i> Bấm "Tiếp nhận" để bắt đầu xử lý lại</div></div>'
                    : '<div class="text-muted" style="padding:20px;text-align:center;font-size:.84rem"><i class="fas fa-hourglass-half" style="font-size:1.8rem;opacity:.3;display:block;margin-bottom:8px"></i>Đang chờ người phụ trách tiếp nhận và xử lý lại</div>'
                );
            return;
        }

        if (isNew) {
            c.innerHTML = '<div style="text-align:center;padding:28px"><i class="fas fa-play-circle" style="font-size:2.5rem;color:#4d85f3;margin-bottom:10px"></i><p style="margin:0;color:#5f6b7c">Bấm <strong>Tiếp nhận</strong> để bắt đầu xử lý phiếu này.</p></div>';
            return;
        }

        if (!canEdit) {
            c.innerHTML = '<div class="text-muted" style="padding:28px;text-align:center"><i class="fas fa-lock" style="font-size:2rem;opacity:.28"></i><p style="margin-top:10px">Chỉ người phụ trách mới có thể ghi nhận kết quả</p></div>';
            return;
        }

        if (isProcessing) {
            c.innerHTML = '<div class="info-item"><div class="info-label"><i class="fas fa-clipboard-check"></i> Kết quả thực hiện <span style="color:#e25b5b">*</span></div>'
                + '<textarea id="aResult" class="form-input-app" rows="5" required placeholder="Mô tả nguyên nhân, biện pháp đã thực hiện...">' + esc(g.result || '') + '</textarea></div>'
                + (afterImgs.length ? '<div class="info-item mt-2"><div class="info-label"><i class="fas fa-images"></i> Ảnh After hiện có</div><div class="info-value">' + renderAfterImagesBlock(afterImgs) + '</div></div>' : '')
                + '<div class="info-item mt-2"><div class="info-label"><i class="fas fa-cloud-upload-alt"></i> Upload ảnh After — ít nhất 1 ảnh <span style="color:#e25b5b">*</span></div>'
                + '<div class="upload-zone-app" onclick="document.getElementById(\'aImages\').click()"><i class="fas fa-cloud-upload-alt"></i><p>Chọn ảnh sau cải tiến</p><small>Có thể chọn nhiều ảnh</small></div>'
                + '<input type="file" id="aImages" hidden multiple accept="image/*">'
                + '<div id="aImagesPreview" class="upload-preview-list"></div></div>';
            bindFileInput('aImages', 'afterImages', 'aImagesPreview');
            renderUploadPreview('aImagesPreview', APP.uploads.afterImages, 'afterImages');
        }
    }

    function renderDetailActions(g) {
        var c = document.getElementById('detailActionsContainer'); if (!c) return;
        c.innerHTML = '';
        var me = String(APP.user.username || '').toLowerCase();
        var creator = String(g.creatorUsername || '').toLowerCase();
        var assignee = String(g.assigneeUsername || '').toLowerCase();
        var canManage = APP.permissions && APP.permissions.canManage;
        var isAdmin = APP.permissions && APP.permissions.isAdmin;
        var status = g.status || g.realStatus || '';

        if (status === 'Mới' || status === 'Chờ xử lý lại') {
            if (assignee === me || canManage) c.innerHTML += '<button class="btn-app btn-warning-app" onclick="actionAccept()"><i class="fas fa-play"></i> Tiếp nhận</button>';
            if (canManage) c.innerHTML += '<button class="btn-app btn-danger-app" onclick="actionReject()"><i class="fas fa-ban"></i> Từ chối</button>';
        }

        if (status === 'Đang xử lý' || status === 'Quá hạn') {
            if (assignee === me || canManage) c.innerHTML += '<button class="btn-app btn-success-app" onclick="actionComplete()"><i class="fas fa-check"></i> Báo hoàn thành</button>';
            if (canManage) c.innerHTML += '<button class="btn-app btn-danger-app" onclick="actionReject()"><i class="fas fa-ban"></i> Từ chối</button>';
        }

        var isOpenStatus = status === 'Mới' || status === 'Chờ xử lý lại' || status === 'Đang xử lý' || status === 'Quá hạn';
        if (isOpenStatus && (creator === me || isAdmin)) c.innerHTML += '<button class="btn-app btn-info-app" onclick="actionEdit()"><i class="fas fa-edit"></i> Sửa phiếu</button>';
        if (status === 'Hoàn thành' && (creator === me || isAdmin)) c.innerHTML += '<button class="btn-app btn-warning-app" onclick="actionReopen()"><i class="fas fa-redo"></i> Yêu cầu xử lý lại</button>';
        if (isAdmin) c.innerHTML += '<button class="btn-app btn-danger-app" onclick="actionDelete()"><i class="fas fa-trash"></i> Xoá</button>';
    }

    /* ═══════════════════════════════════════════════════
       DETAIL ACTIONS
    ═══════════════════════════════════════════════════ */
    function actionAccept() {
        confirmAction('Tiếp nhận phiếu', 'Bạn xác nhận tiếp nhận phiếu ' + APP.currentDetailId + '?', function () {
            var id = APP.currentDetailId;
            var now = new Date().toISOString();
            if (APP.currentDetail) {
                APP.currentDetail.status = APP.currentDetail.realStatus = 'Đang xử lý';
                APP.currentDetail.startedAt = now;
                for (var i = 0; i < APP.gembaList.length; i++) {
                    if (APP.gembaList[i].id === id) { APP.gembaList[i].status = APP.gembaList[i].realStatus = 'Đang xử lý'; APP.gembaList[i].startedAt = now; break; }
                }
                var statusHeader = document.getElementById('detailStatusHeaderBadge');
                if (statusHeader) statusHeader.innerHTML = statusBadge('Đang xử lý');
                renderDetailActions(APP.currentDetail);
                renderDetailAfter(APP.currentDetail);
                if (APP.currentPage === 'gemba') _applyFiltersRaf();
                showToast('Đã tiếp nhận', 'success');
            }
            google.script.run
                .withSuccessHandler(function (res) { if (!res || !res.success) showToast('Lỗi: ' + ((res && res.message) || 'Không xác định') + '. Đang đồng bộ...', 'warning'); refreshAfterMutation('gemba', id); })
                .withFailureHandler(function () { showToast('Lỗi server, đang đồng bộ...', 'warning'); refreshAfterMutation('gemba', id); })
                .acceptGemba(id, APP.user);
        });
    }

    function actionComplete() {
        var resultEl = document.getElementById('aResult');
        var result = resultEl ? (resultEl.value || '').trim() : '';
        if (!result) return showToast('Nhập Kết quả', 'warning');
        var existingAfter = APP.currentDetail && APP.currentDetail.imagesAfter ? APP.currentDetail.imagesAfter : '';
        if (!APP.uploads.afterImages.length && !existingAfter) return showToast('Upload ít nhất 1 ảnh After', 'warning');
        var id = APP.currentDetailId; if (!id) return showToast('Không xác định được phiếu', 'danger');
        showLoader('Đang lưu kết quả...');
        google.script.run
            .withSuccessHandler(function (res) {
                hideLoader();
                if (res && res.success) { APP.uploads.afterImages = []; delete APP.cache.detail[id]; showToast('Đã báo hoàn thành!', 'success'); closeModal('gembaDetailModal'); refreshAfterMutation('gemba', id); }
                else showToast(res && res.message ? res.message : 'Lỗi', 'danger');
            })
            .withFailureHandler(function (err) { hideLoader(); APP.uploads.afterImages = []; handleServerError(err); })
            .completeGemba({ id: id, result: result, imagesAfter: APP.uploads.afterImages, existingImagesAfter: existingAfter }, APP.user);
    }

    function actionReject() {
        var id = APP.currentDetailId;
        promptModal({
            title: 'Từ chối phiếu', desc: 'Nhập lý do từ chối phiếu ' + (id || '') + '. Người tạo và người phụ trách sẽ nhận được thông báo.',
            label: 'Lý do từ chối', placeholder: 'VD: Vấn đề không thuộc phạm vi xử lý / trùng phiếu / thông tin chưa đủ...',
            okText: 'Xác nhận từ chối', danger: true, icon: 'fa-ban', required: true
        }, function (reason) {
            if (APP.currentDetail) {
                APP.currentDetail.status = APP.currentDetail.realStatus = 'Từ chối';
                APP.currentDetail.rejectReason = reason;
                for (var i = 0; i < APP.gembaList.length; i++) { if (APP.gembaList[i].id === id) { APP.gembaList[i].status = APP.gembaList[i].realStatus = 'Từ chối'; break; } }
                showToast('Đã từ chối phiếu', 'success');
                closeModal('gembaDetailModal');
                if (APP.currentPage === 'gemba') _applyFiltersRaf();
            }
            google.script.run
                .withSuccessHandler(function (res) { if (!res || !res.success) showToast('Lỗi: ' + ((res && res.message) || 'Không xác định'), 'warning'); refreshAfterMutation('gemba', id); })
                .withFailureHandler(function () { showToast('Lỗi server, đang đồng bộ...', 'warning'); refreshAfterMutation('gemba', id); })
                .rejectGemba(id, reason, APP.user);
        });
    }

    function actionDelete() {
        confirmAction('Xoá phiếu', 'Bạn chắc chắn muốn xoá phiếu ' + APP.currentDetailId + '? Hành động không thể hoàn tác.', function () {
            var id = APP.currentDetailId;
            var oldList = APP.gembaList.slice();
            APP.gembaList = APP.gembaList.filter(function (g) { return g.id !== id; });
            closeModal('gembaDetailModal');
            if (APP.currentPage === 'gemba') _applyFiltersRaf();
            showToast('Đang xoá...', 'info');
            google.script.run
                .withSuccessHandler(function (res) {
                    if (res && res.success) { showToast('Đã xoá', 'success'); refreshAfterMutation('gemba', null); }
                    else { APP.gembaList = oldList; if (APP.currentPage === 'gemba') _applyFiltersRaf(); showToast((res && res.message) || 'Lỗi xoá', 'danger'); }
                })
                .withFailureHandler(function (err) { APP.gembaList = oldList; if (APP.currentPage === 'gemba') _applyFiltersRaf(); handleServerError(err); })
                .deleteGemba(id, APP.user);
        });
    }

    function actionReopen() {
        var id = APP.currentDetailId, g = APP.currentDetail;
        if (!g || !id) return showToast('Không xác định được phiếu', 'danger');
        promptModal({
            title: 'Yêu cầu xử lý lại',
            desc: 'Phiếu "' + (g.title || id) + '" sẽ chuyển sang trạng thái "Chờ xử lý lại" (đỏ). Người phụ trách sẽ nhận thông báo để làm lại.',
            label: 'Lý do yêu cầu xử lý lại', placeholder: 'VD: Kết quả chưa đạt yêu cầu, vấn đề vẫn còn tồn đọng...',
            okText: 'Xác nhận yêu cầu', icon: 'fa-redo', required: true
        }, function (reason) {
            var NEW_STATUS = 'Chờ xử lý lại';
            if (APP.currentDetail) {
                APP.currentDetail.status = APP.currentDetail.realStatus = NEW_STATUS;
                var statusHeader = document.getElementById('detailStatusHeaderBadge');
                if (statusHeader) statusHeader.innerHTML = statusBadge(NEW_STATUS);
                renderDetailActions(APP.currentDetail);
                renderDetailAfter(APP.currentDetail);
                for (var i = 0; i < APP.gembaList.length; i++) { if (APP.gembaList[i].id === id) { APP.gembaList[i].status = APP.gembaList[i].realStatus = NEW_STATUS; break; } }
                if (APP.currentPage === 'gemba') _applyFiltersRaf();
                showToast('Đã yêu cầu xử lý lại — phiếu chuyển sang "Chờ xử lý lại"', 'success');
            }
            google.script.run
                .withSuccessHandler(function (res) { if (!res || !res.success) showToast('Lỗi: ' + ((res && res.message) || 'Không xác định') + '. Đang đồng bộ...', 'warning'); delete APP.cache.detail[id]; refreshAfterMutation('gemba', id); })
                .withFailureHandler(function () { showToast('Lỗi server, đang đồng bộ...', 'warning'); delete APP.cache.detail[id]; refreshAfterMutation('gemba', id); })
                .reopenGemba(id, reason, APP.user);
        });
    }

    /* ═══════════════════════════════════════════════════
       EDIT GEMBA
    ═══════════════════════════════════════════════════ */
    function actionEdit() {
        var g = APP.currentDetail;
        if (!g) return showToast('Không có dữ liệu phiếu', 'danger');
        if (g.status !== 'Mới') return showToast('Chỉ sửa được phiếu ở trạng thái Mới', 'warning');
        APP.uploads.editImages = [];
        var meta = APP.metadata || {};
        var categories = meta.issueCategories || meta.gembaTypes || [];

        var codeOptions = categories.map(function (c) { return '<option value="' + esc(c.code) + '"' + (c.code === g.typeCode ? ' selected' : '') + '>' + esc(c.code) + '</option>'; }).join('');
        var issueList = (meta.issuesByCategory || {})[g.typeCode] || [];
        var nameOptions = issueList.map(function (it) { return '<option value="' + esc(it.name) + '"' + (it.name === g.issueName ? ' selected' : '') + '>' + esc(it.name) + '</option>'; }).join('');
        var prioOptions = ['Low', 'Medium', 'High', 'Critical'].map(function (p) {
            var labels = { Low: 'Thấp', Medium: 'Trung bình', High: 'Cao', Critical: 'Khẩn cấp' };
            return '<option value="' + p + '"' + (p === g.priority ? ' selected' : '') + '>' + labels[p] + '</option>';
        }).join('');

        var currentImgs = splitUrls(g.imagesBefore);
        var currentImgsHtml = currentImgs.length
            ? '<div class="edit-current-imgs">' + currentImgs.map(function (url) {
                return '<div class="edit-img-item" id="edit-img-' + btoa(url.substring(url.length - 20)).replace(/=/g, '') + '">'
                    + '<img src="' + esc(url) + '" loading="lazy">'
                    + '<button type="button" class="edit-img-remove" onclick="removeEditCurrentImg(this,' + jsq(url) + ')" title="Xoá ảnh này"><i class="fas fa-times"></i></button>'
                    + '</div>';
            }).join('') + '</div>'
            : '<p class="text-muted" style="font-size:.82rem">Chưa có ảnh</p>';

        var isAdmin = APP.permissions && APP.permissions.isAdmin;
        var factorySection = isAdmin
            ? '<div class="row g-2 mt-1">'
            + '<div class="col-4"><label class="form-label-app">Nhà máy</label><input id="editFactory" class="form-input-app" value="' + esc(g.factory || '') + '"></div>'
            + '<div class="col-4"><label class="form-label-app">Line</label><input id="editLine" class="form-input-app" value="' + esc(g.line || '') + '"></div>'
            + '<div class="col-4"><label class="form-label-app">Tổ</label><input id="editTo" class="form-input-app" value="' + esc(g.to || '') + '"></div>'
            + '</div>'
            : '';

        var formHtml = '<div style="padding:0 4px">'
            + '<div class="form-section"><div class="form-section-title"><i class="fas fa-info-circle"></i> Thông tin vấn đề</div>'
            + '<div class="row g-2">'
            + '<div class="col-md-4"><label class="form-label-app required">Mã vấn đề</label><select id="editIssueCode" class="form-input-app" onchange="onEditCodeChange()"><option value="">-- Chọn --</option>' + codeOptions + '</select></div>'
            + '<div class="col-md-5"><label class="form-label-app required">Tên vấn đề</label><select id="editIssueName" class="form-input-app"' + (issueList.length ? '' : ' disabled') + '><option value="">-- Chọn --</option>' + nameOptions + '</select></div>'
            + '<div class="col-md-3"><label class="form-label-app">Ưu tiên</label><select id="editPriority" class="form-input-app">' + prioOptions + '</select></div>'
            + '<div class="col-12"><label class="form-label-app required">Vấn đề ghi nhận</label><input id="editTitle" class="form-input-app" value="' + esc(g.title || '') + '" maxlength="200"></div>'
            + '<div class="col-md-4"><label class="form-label-app">Vị trí chi tiết</label><input id="editLocation" class="form-input-app" value="' + esc(g.location || '') + '"></div>'
            + '<div class="col-md-4"><label class="form-label-app">Mã hàng</label><input id="editProductCode" class="form-input-app" value="' + esc(g.productCode || '') + '"></div>'
            + '<div class="col-12"><label class="form-label-app required">Mô tả vấn đề</label><textarea id="editDescription" class="form-input-app" rows="4">' + esc(g.description || '') + '</textarea></div>'
            + '<div class="col-12"><label class="form-label-app">Đề xuất giải pháp</label><textarea id="editProposal" class="form-input-app" rows="3">' + esc(g.proposal || '') + '</textarea></div>'
            + '</div>' + factorySection + '</div>'
            + '<div class="form-section"><div class="form-section-title"><i class="fas fa-images"></i> Ảnh Before</div>'
            + '<label class="form-label-app">Ảnh hiện tại <small style="color:#94a3b8">(bấm ✕ để xoá)</small></label>'
            + currentImgsHtml
            + '<div id="editRemovedImgsStore" style="display:none"></div>'
            + '<div style="margin-top:12px"><label class="form-label-app">Thêm ảnh mới</label>'
            + '<div class="upload-zone-app" onclick="document.getElementById(\'editImgInput\').click()"><i class="fas fa-cloud-upload-alt"></i><p>Chọn ảnh bổ sung</p><small>JPG, PNG, WEBP — tối đa 10MB/ảnh</small></div>'
            + '<input type="file" id="editImgInput" hidden multiple accept="image/*">'
            + '<div id="editImgPreview" class="upload-preview-list"></div></div></div></div>';

        var editBanner = '<div class="edit-mode-banner"><i class="fas fa-edit"></i><span>Đang ở chế độ <strong>Sửa phiếu</strong> — các thay đổi chưa được lưu</span></div>';
        var afterContainer = document.getElementById('detailAfterContainer');
        if (afterContainer) afterContainer.innerHTML = editBanner + formHtml;
        var rightCol = document.querySelector('#gembaDetailModal .detail-col-right');
        if (rightCol) rightCol.classList.add('edit-mode');

        var inp = document.getElementById('editImgInput');
        if (inp) {
            inp.addEventListener('change', function (e) {
                Array.from(e.target.files || []).forEach(function (f) {
                    if (f.size > 10 * 1024 * 1024) { showToast('File quá lớn: ' + f.name + ' (tối đa 10MB)', 'warning'); return; }
                    var reader = new FileReader();
                    reader.onload = function (ev) {
                        var raw = ev.target.result || '', base64 = raw.indexOf(',') >= 0 ? raw.split(',')[1] : raw;
                        APP.uploads.editImages = APP.uploads.editImages || [];
                        APP.uploads.editImages.push({ name: f.name, type: f.type, data: base64, size: f.size });
                        renderUploadPreview('editImgPreview', APP.uploads.editImages, 'editImages');
                    };
                    reader.readAsDataURL(f);
                });
                e.target.value = '';
            });
        }

        var actContainer = document.getElementById('detailActionsContainer');
        if (actContainer) {
            actContainer.innerHTML = '<button class="btn-app btn-secondary-app" onclick="cancelEditGemba()"><i class="fas fa-times"></i> Hủy sửa</button>'
                + '<button class="btn-app btn-primary-app" onclick="submitEditGemba()"><i class="fas fa-save"></i> Lưu thay đổi</button>';
        }
    }

    function onEditCodeChange() {
        var code = (document.getElementById('editIssueCode') || {}).value || '';
        var nameSel = document.getElementById('editIssueName');
        var list = ((APP.metadata || {}).issuesByCategory || {})[code] || [];
        if (!nameSel) return;
        nameSel.innerHTML = '<option value="">-- Chọn --</option>' + list.map(function (it) { return '<option value="' + esc(it.name) + '">' + esc(it.name) + '</option>'; }).join('');
        nameSel.disabled = !list.length;
    }

    function removeEditCurrentImg(btn, url) {
        var item = btn.closest('.edit-img-item');
        if (item) { item.style.opacity = '0.3'; item.style.pointerEvents = 'none'; btn.innerHTML = '<i class="fas fa-undo"></i>'; btn.title = 'Khôi phục'; btn.onclick = function () { restoreEditCurrentImg(btn, url); }; }
        var store = document.getElementById('editRemovedImgsStore');
        if (store) { var current = JSON.parse(store.dataset.removed || '[]'); if (current.indexOf(url) < 0) current.push(url); store.dataset.removed = JSON.stringify(current); }
    }

    function restoreEditCurrentImg(btn, url) {
        var item = btn.closest('.edit-img-item');

    function submitEditGemba() {
        var g = APP.currentDetail, id = APP.currentDetailId;
        if (!g || !id) return showToast('Không xác định được phiếu', 'danger');

        var title = ((document.getElementById('editTitle') || {}).value || '').trim();
        var description = ((document.getElementById('editDescription') || {}).value || '').trim();
        var typeCode = ((document.getElementById('editIssueCode') || {}).value || '').trim();
        var issueName = ((document.getElementById('editIssueName') || {}).value || '').trim();
        var priority = ((document.getElementById('editPriority') || {}).value || '').trim();
        var location = ((document.getElementById('editLocation') || {}).value || '').trim();
        var productCode = ((document.getElementById('editProductCode') || {}).value || '').trim();
        var proposal = ((document.getElementById('editProposal') || {}).value || '').trim();

        if (!title) return showToast('Nhập Vấn đề ghi nhận', 'warning');
        if (!description) return showToast('Nhập Mô tả vấn đề', 'warning');
        if (!typeCode) return showToast('Chọn Mã vấn đề', 'warning');

        var store = document.getElementById('editRemovedImgsStore');
        var removeImgs = store ? JSON.parse(store.dataset.removed || '[]') : [];
        var keptImgs = splitUrls(g.imagesBefore).filter(function (u) { return removeImgs.indexOf(u) < 0; });
        var newImgs = APP.uploads.editImages || [];
        if (keptImgs.length === 0 && newImgs.length === 0) return showToast('Phải giữ lại hoặc thêm ít nhất 1 ảnh Before', 'warning');

        var payload = { id: id, title: title, description: description, typeCode: typeCode, issueName: issueName, priority: priority, location: location, productCode: productCode, proposal: proposal, newImagesBefore: newImgs, removeImagesBefore: removeImgs };
        if (APP.permissions && APP.permissions.isAdmin) {
            var f = document.getElementById('editFactory'); var l = document.getElementById('editLine'); var t = document.getElementById('editTo');
            if (f) payload.factory = (f.value || '').trim();
            if (l) payload.line = (l.value || '').trim();
            if (t) payload.to = (t.value || '').trim();
        }

        showLoader('Đang lưu thay đổi...');
        google.script.run
            .withSuccessHandler(function (res) {
                hideLoader();
                if (!res || !res.success) { showToast(res && res.message ? res.message : 'Lỗi cập nhật phiếu', 'danger'); return; }
                showToast('Đã lưu thay đổi', 'success');
                var rightCol = document.querySelector('#gembaDetailModal .detail-col-right');
                if (rightCol) rightCol.classList.remove('edit-mode');
                APP.uploads.editImages = [];
                delete APP.cache.detail[id];
                Object.assign(APP.currentDetail, { title: payload.title, description: payload.description, typeCode: payload.typeCode, issueName: payload.issueName, priority: payload.priority, location: payload.location, productCode: payload.productCode, proposal: payload.proposal });
                renderGembaDetail(APP.currentDetail, []);
                refreshAfterMutation('gemba', id);
            })
            .withFailureHandler(function (err) { hideLoader(); handleServerError(err); })
            .updateGembaContent(payload, APP.user);
    }

    function loadUsers(opts) {
        opts = opts || {};
        var cached = APP.cache.users;
        var hasCache = cached && cached.data && cached.data.length;
        var isFreshCache = hasCache && (Date.now() - cached.at < CACHE_TTL.users);

        // Khi FORCE: bỏ qua cache cũ, tải mới hoàn toàn
        if (opts.force) {
            showLoader('Đang tải user...');
            google.script.run
                .withSuccessHandler(function (list) {
                    hideLoader();
                    APP.userList = list || [];
                    APP.cache.users = { at: Date.now(), data: list || [] };
                    renderUserTable();
                })
                .withFailureHandler(function (err) { hideLoader(); handleServerError(err); })
                .getUserList();
            return;
        }

        if (hasCache) { APP.userList = cached.data; renderUserTable(); if (isFreshCache) return; }
        else showLoader('Đang tải user...');

        google.script.run
            .withSuccessHandler(function (list) { if (!hasCache) hideLoader(); APP.userList = list || []; APP.cache.users = { at: Date.now(), data: list || [] }; renderUserTable(); })
            .withFailureHandler(function (err) { if (!hasCache) hideLoader(); if (!hasCache) handleServerError(err); })
            .getUserList();
    }

    function submitUser() {
        var mode = document.getElementById('userMode').value;

        function normMulti(v) {
            return String(v || '').split(',')
                .map(function (x) { return x.trim(); })
                .filter(Boolean).join(', ');
        }

        var payload = {
            username: (document.getElementById('uUsername').value || '').trim(),
            fullName: (document.getElementById('uFullName').value || '').trim(),
            group: document.getElementById('uGroup').value,        // Nhóm đăng nhập — độc lập
            factory: document.getElementById('uFactory').value,
            line: normMulti(document.getElementById('uLine').value),
            to: normMulti(document.getElementById('uTo').value),
            department: (document.getElementById('uDepartment').value || '').trim(),  // Phòng ban — độc lập
            position: (document.getElementById('uPosition').value || '').trim(),
            email: (document.getElementById('uEmail').value || '').trim(),
            phone: (document.getElementById('uPhone').value || '').trim(),
            role: document.getElementById('uRole').value,
            status: document.getElementById('uStatus').value,
            password: document.getElementById('uPassword').value
        };

        if (!payload.username || !payload.fullName || !payload.group || !payload.role) {
            showToast('Nhập đầy đủ thông tin bắt buộc', 'warning');
            return;
        }
        if (mode === 'add' && !payload.password) payload.password = '123456';

        showLoader('Đang lưu user...');

        var handler = function (res) {
            hideLoader();
            if (!res || !res.success) {
                showToast((res && res.message) || 'Lỗi', 'danger');
                return;
            }
            showToast('Lưu thành công', 'success');
            closeModal('userModal');

            // Xoá sạch mọi cache client liên quan để tránh hiển thị dữ liệu cũ
            APP.cache.users = { at: 0, data: null };
            APP._userSimpleList = null;
            ['dashboard', 'gemba', 'mytasks'].forEach(function (p) {
                delete APP.cache.pages[getPageCacheKey(p)];
            });

            loadUsers({ force: true });
        };

        if (mode === 'add') {
            google.script.run.withSuccessHandler(handler).withFailureHandler(handleServerError).addNewUser(payload);
        } else {
            google.script.run.withSuccessHandler(handler).withFailureHandler(handleServerError).updateUser(payload);
        }
    }

    function confirmDeleteUser(username) {
        confirmAction('Xoá user', 'Bạn chắc chắn muốn xoá "' + username + '"?', function () {
            var oldList = APP.userList.slice();
            APP.userList = APP.userList.filter(function (u) { return u.username !== username; });
            renderUserTable(); showToast('Đang xoá...', 'info');
            google.script.run
                .withSuccessHandler(function (res) {
                    if (res.success) { showToast('Đã xoá', 'success'); APP.cache.users = { at: Date.now(), data: APP.userList }; }
                    else { APP.userList = oldList; renderUserTable(); showToast(res.message || 'Lỗi', 'danger'); }
                })
                .withFailureHandler(function (err) { APP.userList = oldList; renderUserTable(); handleServerError(err); })
                .deleteUser(username);
        });

    var _notifPollTimer = null;
    var _notifPollBusy = false;
    var _notifFailCount = 0;
    var _lastPollMs = 0;
    var NOTIF_POLL_BASE = 120000;
    var NOTIF_POLL_MAX = 600000;

    function startNotifPoll() { stopNotifPoll(); _notifFailCount = 0; _scheduleNextPoll(NOTIF_POLL_BASE); }
    function stopNotifPoll() { if (_notifPollTimer) { clearTimeout(_notifPollTimer); _notifPollTimer = null; } _notifPollBusy = false; }
    function _scheduleNextPoll(ms) { stopNotifPoll(); _notifPollTimer = setTimeout(_doPollOnce, ms); }

    function _doPollOnce() {
        var now = Date.now();
        if (!APP.user || document.hidden || _notifPollBusy || (now - _lastPollMs < 60000)) { _scheduleNextPoll(NOTIF_POLL_BASE); return; }
        _notifPollBusy = true; _lastPollMs = now;
        google.script.run
            .withSuccessHandler(function (res) {
                _notifPollBusy = false; _notifFailCount = 0;
                var n = (res && typeof res === 'object') ? (res.unread || 0) : (Number(res) || 0);
                setNotifBadge(n); _scheduleNextPoll(NOTIF_POLL_BASE);
            })
            .withFailureHandler(function () {
                _notifPollBusy = false; _notifFailCount++;
                _scheduleNextPoll(Math.min(NOTIF_POLL_BASE * Math.pow(2, _notifFailCount), NOTIF_POLL_MAX));
            })
            .pollNotifLight(APP.user.username);
    }

    function _bindNotifCascadeFilters() {
        var facSel = document.getElementById('notifFactoryFilter');
        var lineSel = document.getElementById('notifLineFilter');
        if (!facSel || facSel.dataset.notifBound === '1') return;
        facSel.dataset.notifBound = '1';

        // Khi chọn Nhà máy → cập nhật dropdown Line
        facSel.addEventListener('change', function () {
            var fac = this.value;
            var meta = APP.metadata || {};

            lineSel.innerHTML = '<option value="">Tất cả line</option>';
            lineSel.disabled = true;
            lineSel.value = '';

            if (fac) {
                var lines = (meta.linesByFactory || {})[fac] || [];
                if (lines.length) {
                    lineSel.innerHTML += lines.map(function (l) {
                        return '<option value="' + esc(l) + '">' + esc(l) + '</option>';
                    }).join('');
                    lineSel.disabled = false;
                }
            }
            renderNotifRecipients();
        });

        // Khi chọn Line → lọc lại danh sách
        lineSel.addEventListener('change', function () {
            renderNotifRecipients();
        });
    }

    function _normClient(s) {
        if (!s) return '';
        return String(s)
            .normalize('NFD')
            .replace(/[\u0300-\u036f]/g, '')
            .replace(/đ/gi, 'd')
            .replace(/\s+/g, ' ')
            .trim()
            .toUpperCase();
    }

    function _splitMultiClient(s) {
        if (!s) return [];
        return String(s)
            .split(/[,;|]/)
            .map(function (x) { return _normClient(x); })
            .filter(function (x) { return x !== ''; });
    }

    function renderNotifRecipients() {
        var box = document.getElementById('notifReceiverList');
        if (!box) return;

        var facFilter = ((document.getElementById('notifFactoryFilter') || {}).value) || '';
        var lineFilter = ((document.getElementById('notifLineFilter') || {}).value) || '';
        var roleFilter = ((document.getElementById('notifReceiverFilter') || {}).value) || '';
        var kw = ((document.getElementById('notifReceiverSearch') || {}).value || '').toLowerCase().trim();

        var list = (APP.notifRecipients || []).filter(function (u) {

            // Lọc theo Nhà máy
            // Nếu user không có factory (Admin/VP) → cho qua
            if (facFilter) {
                var uFacs = _splitMultiClient(u.factory);
                if (uFacs.length > 0 && uFacs.indexOf(_normClient(facFilter)) < 0) return false;
            }

            // Lọc theo Line
            // Nếu user không có line (Admin/VP/Trưởng line quản lý nhiều) → cho qua
            if (lineFilter) {
                var uLines = _splitMultiClient(u.line);
                if (uLines.length > 0 && uLines.indexOf(_normClient(lineFilter)) < 0) return false;
            }

            // Lọc theo vai trò
            if (roleFilter && roleFilter.indexOf('role:') === 0) {
                var roleTarget = roleFilter.split(':').slice(1).join(':');
                if (String(u.role || '').toLowerCase() !== roleTarget.toLowerCase()) return false;
            }

            // Tìm kiếm theo tên / username / factory / line / role
            if (kw) {
                var blob = [
                    u.username || '',
                    u.fullName || '',
                    u.factory || '',
                    u.line || '',
                    u.role || ''
                ].join(' ').toLowerCase();
                if (blob.indexOf(kw) < 0) return false;
            }

            return true;
        });

        // Cập nhật badge số người đang hiển thị
        var countEl = document.getElementById('notifFilteredCount');
        if (countEl) {
            var total = (APP.notifRecipients || []).length;
            if (list.length < total) {
                countEl.innerHTML = 'Hiển thị <strong style="color:#d48e19">'
                    + list.length + '</strong> / ' + total + ' người';
            } else {
                countEl.innerHTML = 'Tổng <strong>' + total + '</strong> người';
            }
        }

        if (!list.length) {
            box.innerHTML = '<div class="notif-empty" style="padding:20px">'
                + '<i class="fas fa-filter" style="font-size:1.6rem;opacity:.3;display:block;margin-bottom:7px"></i>'
                + '<p>Không có người nhận phù hợp với bộ lọc hiện tại</p>'
                + '</div>';
            updateNotifSelectedCount();
            return;
        }

        box.innerHTML = list.map(function (u) {
            // Dòng phụ: username • vai trò • nhà máy / line / tổ
            var locationInfo = [u.factory, u.line, u.to].filter(Boolean).join(' / ');
            var subLabel = u.username
                + (u.role ? ' • ' + u.role : '')
                + (locationInfo ? ' • ' + locationInfo : '');

            return '<label class="notif-recv-item">'
                + '<input type="checkbox" class="notif-recv-cb"'
                + ' value="' + esc(u.username) + '"'
                + ' onchange="updateNotifSelectedCount()">'
                + '<span class="notif-recv-avatar">'
                + esc((u.fullName || 'U').charAt(0).toUpperCase())
                + '</span>'
                + '<span class="notif-recv-meta">'
                + '<strong>' + esc(u.fullName) + '</strong>'
                + '<small>' + esc(subLabel) + '</small>'
                + '</span>'
                + '</label>';
        }).join('');

        updateNotifSelectedCount();
    }

    function refreshAfterMutation(targetPage, mutatedId) {
        targetPage = targetPage || APP.currentPage || 'gemba';
        APP.cache.detail = {};
        [getPageCacheKey('gemba'), getPageCacheKey('mytasks'), getPageCacheKey('dashboard')].forEach(function (k) { delete APP.cache.pages[k]; });

        google.script.run
            .withSuccessHandler(function (res) {
                if (!res || !res.success) { loadBootstrapPage(targetPage, { force: true, showLoader: false, background: true }); return; }
                var data = res.data || {};

                if (data.treeStats) {
                    APP.treeStats = data.treeStats;
                    renderGembaTree(data.treeStats.tree || [], data.treeStats.total || 0, data.treeStats.unfinished || 0);
                }

                if (data.myTasks != null) {
                    updateMyTaskBadge(data.myTasks);
                    if (APP.currentPage === 'mytasks') renderMyTasks(data.myTasks);
                } else if (APP.currentPage === 'mytasks') {
                    loadBootstrapPage('mytasks', { force: true, showLoader: false, background: true });
                }

                if (typeof data.unreadCount === 'number') setNotifBadge(data.unreadCount);

                if (APP.currentPage === 'gemba') {
                    if (data.updatedGemba) {
                        var found = false;
                        for (var i = 0; i < APP.gembaList.length; i++) {
                            if (APP.gembaList[i].id === data.updatedGemba.id) {
                                data.updatedGemba._createdMs = APP.gembaList[i]._createdMs || (data.updatedGemba.createdAt ? new Date(data.updatedGemba.createdAt).getTime() : 0);
                                APP.gembaList[i] = data.updatedGemba; found = true; break;
                            }
                        }
                        if (!found) { data.updatedGemba._createdMs = data.updatedGemba.createdAt ? new Date(data.updatedGemba.createdAt).getTime() : 0; APP.gembaList.unshift(data.updatedGemba); }
                        _applyFiltersRaf();
                    } else if (mutatedId === null) {
                        google.script.run
                            .withSuccessHandler(function (list) { APP.gembaList = preprocessGembaList(list || []); _applyFiltersRaf(); })
                            .withFailureHandler(function () { loadBootstrapPage('gemba', { force: true, showLoader: false, background: true }); })
                            .getGembaList({ user: APP.user });
                    } else {
                        google.script.run
                            .withSuccessHandler(function (list) { APP.gembaList = preprocessGembaList(list || []); _applyFiltersRaf(); })
                            .withFailureHandler(function () { loadBootstrapPage('gemba', { force: true, showLoader: false, background: true }); })
                            .getGembaList({ user: APP.user });
                    }
                }

                if (APP.currentPage === 'dashboard' && APP.permissions && APP.permissions.canViewDashboard) {
                    setTimeout(function () { loadBootstrapPage('dashboard', { force: true, showLoader: false, background: true }); }, 500);

                    APP.cache.users = { at: 0, data: APP.cache.users ? APP.cache.users.data : null };
                    loadUsers({ force: true });
                }
            })
            .withFailureHandler(function () { loadBootstrapPage(targetPage, { force: true, showLoader: false, background: true }); })
            .getMutationDelta({ user: APP.user, gembaId: mutatedId || null });
    }

    var _importUserData = [];

    function openImportUserModal() {
        _importUserData = [];
        var previewWrap = document.getElementById('importPreviewWrap');
        var resultWrap = document.getElementById('importResultWrap');
        var submitBtn = document.getElementById('importSubmitBtn');
        var csvFileName = document.getElementById('csvFileName');
        var csvInput = document.getElementById('csvFileInput');
        if (previewWrap) previewWrap.style.display = 'none';
        if (resultWrap) resultWrap.style.display = 'none';
        if (submitBtn) submitBtn.disabled = true;
        if (csvFileName) csvFileName.textContent = 'Kéo thả hoặc bấm để chọn file CSV';
        if (csvInput) csvInput.value = '';

        var inp = document.getElementById('csvFileInput');
        if (inp && inp.dataset.bound !== '1') {
            inp.dataset.bound = '1';
            inp.addEventListener('change', function (e) {
                var file = e.target.files && e.target.files[0]; if (!file) return;
                if (!file.name.toLowerCase().endsWith('.csv')) { showToast('Chỉ hỗ trợ file CSV (.csv)', 'warning'); e.target.value = ''; return; }
                if (file.size > 2 * 1024 * 1024) { showToast('File quá lớn (tối đa 2MB)', 'warning'); e.target.value = ''; return; }
                var nameEl = document.getElementById('csvFileName'); if (nameEl) nameEl.textContent = file.name + ' (' + formatBytes(file.size) + ')';
                _parseCSVFile(file);
            });
            var zone = document.getElementById('csvDropZone');
            if (zone) {
                zone.addEventListener('dragover', function (e) { e.preventDefault(); zone.style.borderColor = '#2f7d57'; zone.style.background = '#edf9f3'; });
                zone.addEventListener('dragleave', function () { zone.style.borderColor = ''; zone.style.background = ''; });
                zone.addEventListener('drop', function (e) {
                    e.preventDefault(); zone.style.borderColor = ''; zone.style.background = '';
                    var file = e.dataTransfer.files && e.dataTransfer.files[0]; if (!file) return;
                    if (!file.name.toLowerCase().endsWith('.csv')) { showToast('Chỉ hỗ trợ file CSV', 'warning'); return; }
                    var nameEl = document.getElementById('csvFileName'); if (nameEl) nameEl.textContent = file.name + ' (' + formatBytes(file.size) + ')';
                    _parseCSVFile(file);
                });
            }
        }
        openModal('importUserModal');
    }

    function _parseCSVFile(file) {
        var reader = new FileReader();
        reader.onload = function (ev) {
            try {
                var text = ev.target.result || '';
                if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
                var lines = text.split(/\r?\n/).filter(function (l) { return l.trim(); });
                if (lines.length < 2) { showToast('File CSV không có dữ liệu (cần ít nhất 1 dòng header + 1 dòng data)', 'warning'); return; }

                var headers = _parseCSVLine(lines[0]).map(function (h) { return h.trim().toLowerCase().replace(/\s+/g, '_'); });
                var COL_MAP = {
                    username: ['username', 'user', 'ten_dang_nhap', 'ten_nguoi_dung'],
                    fullName: ['fullname', 'full_name', 'ho_va_ten', 'ho_ten', 'ten'],
                    group: ['group', 'nhom', 'nhom_dang_nhap'],
                    factory: ['factory', 'nha_may'],
                    line: ['line', 'chuyen'],
                    to: ['to', 'team', 'to_san_xuat'],
                    department: ['department', 'dept', 'phong_ban'],
                    position: ['position', 'chuc_vu'],
                    email: ['email', 'e-mail', 'mail'],
                    phone: ['phone', 'sdt', 'dien_thoai', 'so_dien_thoai'],
                    role: ['role', 'quyen', 'quyen_han'],
                    password: ['password', 'mat_khau', 'pwd'],
                    status: ['status', 'trang_thai'],
                    token: ['token', 'mmtb_token']
                };
                function findColIdx(fieldKey) {
                    var aliases = COL_MAP[fieldKey] || [];
                    for (var j = 0; j < headers.length; j++) { if (aliases.indexOf(headers[j]) >= 0) return j; }
                    return -1;
                }
                var colIdx = {}; Object.keys(COL_MAP).forEach(function (k) { colIdx[k] = findColIdx(k); });
                if (colIdx.username < 0) { showToast('File CSV thiếu cột "username" (bắt buộc)', 'danger'); return; }
                if (colIdx.fullName < 0) { showToast('File CSV thiếu cột "fullName" hoặc "ho_va_ten" (bắt buộc)', 'danger'); return; }

                _importUserData = [];
                for (var i = 1; i < lines.length; i++) {
                    var cells = _parseCSVLine(lines[i]);
                    if (!cells.length || cells.every(function (c) { return !c.trim(); })) continue;
                    function getCell(field) { var idx = colIdx[field]; return idx >= 0 ? (cells[idx] || '').trim() : ''; }
                    var username = getCell('username'), fullName = getCell('fullName');
                    if (!username && !fullName) continue;
                    _importUserData.push({ username: username, fullName: fullName, group: getCell('group'), factory: getCell('factory'), line: getCell('line'), to: getCell('to'), department: getCell('department'), position: getCell('position'), email: getCell('email'), phone: getCell('phone'), role: getCell('role') || 'Nhân viên', password: getCell('password') || '123456', status: getCell('status') || 'Active', token: getCell('token') });
                }
                if (!_importUserData.length) { showToast('Không tìm thấy dòng dữ liệu hợp lệ trong file', 'warning'); return; }
                _renderImportPreview(_importUserData);
            } catch (e) { showToast('Lỗi đọc file CSV: ' + e.message, 'danger'); }
        };
        reader.onerror = function () { showToast('Không đọc được file', 'danger'); };
        reader.readAsText(file, 'UTF-8');
    }

    function _parseCSVLine(line) {
        var result = [], current = '', inQuotes = false;
        for (var i = 0; i < line.length; i++) {
            var ch = line[i];
            if (ch === '"') { if (inQuotes && line[i + 1] === '"') { current += '"'; i++; } else inQuotes = !inQuotes; }
            else if (ch === ',' && !inQuotes) { result.push(current.trim()); current = ''; }
            else current += ch;
        }
        result.push(current.trim());
        return result;
    }

    function _renderImportPreview(data) {
        var previewWrap = document.getElementById('importPreviewWrap');
        var previewCount = document.getElementById('importPreviewCount');
        var tbody = document.getElementById('importPreviewBody');
        var submitBtn = document.getElementById('importSubmitBtn');
        var countSpan = document.getElementById('importSubmitCount');
        var resultWrap = document.getElementById('importResultWrap');
        if (resultWrap) resultWrap.style.display = 'none';
        if (!data.length) { if (previewWrap) previewWrap.style.display = 'none'; if (submitBtn) submitBtn.disabled = true; return; }
        if (previewCount) previewCount.textContent = data.length;
        if (countSpan) countSpan.textContent = ' (' + data.length + ' dòng)';
        if (submitBtn) submitBtn.disabled = false;
        if (tbody) {
            tbody.innerHTML = data.slice(0, 50).map(function (u, idx) {
                var hasError = !u.username || !u.fullName;
                return '<tr' + (hasError ? ' style="background:#fff1f1"' : '') + '>'
                    + '<td>' + (idx + 1) + '</td>'
                    + '<td><strong>' + esc(u.username || '<em style="color:#e25b5b">Thiếu</em>') + '</strong></td>'
                    + '<td>' + esc(u.fullName || '') + '</td>'
                    + '<td>' + esc(u.group || '—') + '</td>'
                    + '<td>' + esc(u.factory || '—') + '</td>'
                    + '<td>' + esc(u.line ? u.line + ' / ' + (u.to || '') : '—') + '</td>'
                    + '<td><span class="status-pill s-primary" style="font-size:.68rem">' + esc(u.role || 'Nhân viên') + '</span></td>'
                    + '<td>' + esc(u.email || '—') + '</td>'
                    + '<td>' + (u.status === 'Inactive' ? '<i class="fas fa-times text-danger"></i>' : '<i class="fas fa-check text-success"></i>') + '</td>'
                    + '</tr>';
            }).join('')
                + (data.length > 50 ? '<tr><td colspan="9" class="text-center text-muted" style="padding:8px">... và ' + (data.length - 50) + ' dòng khác</td></tr>' : '');
        }
        if (previewWrap) previewWrap.style.display = 'block';
    }

    function clearImportData() {
        _importUserData = [];
        var previewWrap = document.getElementById('importPreviewWrap');
        var submitBtn = document.getElementById('importSubmitBtn');
        var csvInput = document.getElementById('csvFileInput');
        var csvFileName = document.getElementById('csvFileName');
        if (previewWrap) previewWrap.style.display = 'none';
        if (submitBtn) submitBtn.disabled = true;
        if (csvInput) csvInput.value = '';
        if (csvFileName) csvFileName.textContent = 'Kéo thả hoặc bấm để chọn file CSV';
    }

    function submitImportUsers() {
        if (!_importUserData || !_importUserData.length) { showToast('Chưa có dữ liệu để import', 'warning'); return; }
        if (_importUserData.length > 500) { showToast('Tối đa 500 dòng mỗi lần import. File của bạn có ' + _importUserData.length + ' dòng.', 'warning'); return; }
        var submitBtn = document.getElementById('importSubmitBtn');
        if (submitBtn) { submitBtn.disabled = true; submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Đang import...'; }
        showLoader('Đang import ' + _importUserData.length + ' users...', 'soft');
        google.script.run
            .withSuccessHandler(function (res) {
                hideLoader();
                if (submitBtn) { submitBtn.disabled = false; submitBtn.innerHTML = '<i class="fas fa-cloud-upload-alt"></i> Import'; }
                var resultWrap = document.getElementById('importResultWrap'); if (!resultWrap) return;
                if (!res || !res.success) {
                    resultWrap.innerHTML = '<div style="background:#fff1f1;border-left:4px solid #e25b5b;padding:14px;border-radius:6px"><strong style="color:#d14747"><i class="fas fa-times-circle"></i> Import thất bại</strong><p style="margin:6px 0 0;color:#5f6b7c;font-size:.84rem">' + esc((res && res.message) || 'Lỗi không xác định') + '</p></div>';
                    resultWrap.style.display = 'block'; return;
                }
                var errHtml = '';
                if (res.errors && res.errors.length) {
                    errHtml = '<details style="margin-top:10px"><summary style="cursor:pointer;color:#d48e19;font-size:.84rem"><i class="fas fa-exclamation-triangle"></i> ' + res.errors.length + ' cảnh báo (bấm để xem)</summary><ul style="margin:8px 0 0;padding-left:18px;font-size:.8rem;color:#5f6b7c">' + res.errors.map(function (e) { return '<li>' + esc(e) + '</li>'; }).join('') + '</ul></details>';
                }
                resultWrap.innerHTML = '<div style="background:#edf9f3;border-left:4px solid #22a06b;padding:14px;border-radius:6px"><strong style="color:#1d8d5d"><i class="fas fa-check-circle"></i> Import thành công!</strong>'
                    + '<div style="margin-top:8px;display:flex;gap:16px;flex-wrap:wrap"><span style="font-size:.84rem;color:#5f6b7c"><i class="fas fa-users"></i> Tổng: <strong>' + (res.total || 0) + '</strong></span><span style="font-size:.84rem;color:#1d8d5d"><i class="fas fa-user-plus"></i> Đã thêm: <strong>' + (res.added || 0) + '</strong></span><span style="font-size:.84rem;color:#d48e19"><i class="fas fa-forward"></i> Bỏ qua: <strong>' + (res.skipped || 0) + '</strong></span></div>'
                    + errHtml + '</div>';
                resultWrap.style.display = 'block';
                _importUserData = []; clearImportData();
                APP.cache.users = { at: 0, data: null }; loadUsers({ force: true });
                showToast(res.message || 'Import xong!', 'success');
            })
            .withFailureHandler(function (err) {
                hideLoader();
                if (submitBtn) { submitBtn.disabled = false; submitBtn.innerHTML = '<i class="fas fa-cloud-upload-alt"></i> Import'; }
                handleServerError(err);
            })
            .importUsersBatch(_importUserData);
    }

    function downloadImportTemplate() {
        var headers = ['username', 'fullName', 'group', 'factory', 'line', 'to', 'department', 'position', 'email', 'phone', 'role', 'password', 'status', 'token'];
        var sampleRows = [
            ['nguyen_van_a', 'Nguyễn Văn A', 'PX chặt', 'PX chặt', 'Line may 1', 'Tổ may 1', 'SX', 'Nhân viên', 'nva@tbsbag.com', '0901234567', 'Nhân viên', '123456', 'Active', ''],
            ['tran_thi_b', 'Trần Thị B', 'PX may', 'PX may', 'LINE_HTG 1', 'Tổ công đoạn 1', 'SX', 'Tổ trưởng', 'ttb@tbsbag.com', '0901234568', 'Tổ trưởng', '123456', 'Active', ''],
            ['le_van_c', 'Lê Văn C', 'VP Chuỗi', '', '', '', 'KD', 'Viewer', 'lvc@tbsbag.com', '0901234569', 'Viewer', '123456', 'Active', '']
        ];
        var csvContent = '\uFEFF' + headers.join(',') + '\n';
        sampleRows.forEach(function (row) {
            csvContent += row.map(function (cell) { return cell.indexOf(',') >= 0 || cell.indexOf('"') >= 0 ? '"' + cell.replace(/"/g, '""') + '"' : cell; }).join(',') + '\n';
        });
        var blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });

        var a = document.createElement('a');
        a.href = url; a.download = 'GembaPro_Import_Users_Template.csv';
        document.body.appendChild(a); a.click();
        setTimeout(function () { URL.revokeObjectURL(url); document.body.removeChild(a); }, 500);
    }

    function applyBrandingToUI(b) {
        if (!b) return;
        try {
            function safe(v) { return (v == null ? '' : String(v)); }
            var name = safe(b.appName);
            var dot = safe(b.appDot);
            var brandHtml = name + '<span class="logo-dot">.</span>' + dot;

            var loginLogoText = document.querySelector('#loginScreen .logo-text');
            if (loginLogoText) loginLogoText.innerHTML = brandHtml;

            var loginSub = document.querySelector('#loginScreen .logo-subtitle');
            if (loginSub) loginSub.textContent = safe(b.appSubtitle);

            var lt = document.querySelector('#loginScreen .login-title');
            if (lt && safe(b.loginTitle)) lt.textContent = safe(b.loginTitle);

            var ls = document.querySelector('#loginScreen .login-subtitle');
            if (ls && safe(b.loginSubtitle)) ls.textContent = safe(b.loginSubtitle);

            var sbLogo = document.querySelector('#sidebar .logo-text-sm');
            if (sbLogo) sbLogo.innerHTML = brandHtml;

            var sbSub = document.querySelector('#sidebar .logo-text-sub');
            if (sbSub) sbSub.textContent = safe(b.appSubtitle);

            if (name) document.title = name + '.' + dot + ' — ' + safe(b.appOrg);
        } catch (e) { }
    }
