<script>
    const APP = {
        user: null,
        metadata: null,
        gembaList: [],
        filteredGemba: [],
        userList: [],
        treeStats: null,
        currentView: 'table',
        currentPage: 'dashboard',
        sidebarCollapsed: false,
        uploads: { images: [], video: [], files: [], afterImages: [] },
        currentDetailId: null,
        currentDetail: null,
        filters: { factory: '', line: '', to: '', status: '', search: '' },
        charts: {},
        bootstrapLoaded: false,
        advancedData: null,
        notifications: [],
        notifRecipients: [],
        notifPollTimer: null,
        cache: { pages: {}, detail: {}, users: { at: 0, data: null } },
        showDoneItems: false,
        currentPage_gemba: 1,
        pageSize: 20,
        dashReqId: 0,
        lastDashSnapshot: null,
        appVersion: '1',
        permissions: {},
        treeExpandedKeys: {}
    };

    const CACHE_TTL = {
        dashboard: 120000,
        gemba: 90000,
        mytasks: 60000,
        detail: 180000,
        users: 300000
    };

    const STATUS_COLOR_MAP = {
        'Mới': { color: '#4d85f3', bg: '#eef4ff', cls: 's-pending' },
        'Đang xử lý': { color: '#d48e19', bg: '#fff6e8', cls: 's-progress' },
        'Hoàn thành': { color: '#1d8d5d', bg: '#edf9f3', cls: 's-done' },
        'Quá hạn': { color: '#d14747', bg: '#fff1f1', cls: 's-overdue' },
        'Từ chối': { color: '#7e8796', bg: '#f1f3f7', cls: 's-cancel' },
        'Chờ xử lý lại': { color: '#c0392b', bg: '#fff0f0', cls: 's-reopen' }
    };

    const PRIORITY_MAP = {
        'Low': { vi: 'Thấp', cls: 's-primary' },
        'Medium': { vi: 'Trung bình', cls: 's-pending' },
        'High': { vi: 'Cao', cls: 's-warning' },
        'Critical': { vi: 'Khẩn cấp', cls: 's-danger' }
    };

    /* ═══════════════════════════════════════════════════
       STORAGE
    ═══════════════════════════════════════════════════ */
    function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
    function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) { } }
    function lsRemove(k) { try { localStorage.removeItem(k); } catch (e) { } }

    /* ═══════════════════════════════════════════════════
       UTILITIES
    ═══════════════════════════════════════════════════ */
    function esc(s) {
        if (s == null) return '';
        return String(s)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }
    function jsq(s) { return JSON.stringify(s == null ? '' : String(s)); }
    function truncate(s, n) { s = String(s || ''); return s.length > n ? s.substring(0, n) + '…' : s; }
    function setText(id, val) { var el = document.getElementById(id); if (el) el.textContent = (val == null ? '' : val); }
    function formatNumber(n) { return new Intl.NumberFormat('vi-VN').format(n || 0); }
    function formatBytes(b) {
        if (!b) return '';
        var k = 1024, sizes = ['B', 'KB', 'MB', 'GB'], i = Math.floor(Math.log(b) / Math.log(k));
        return (b / Math.pow(k, i)).toFixed(1) + ' ' + sizes[i];
    }
    function formatDate(d) {
        if (!d) return '';
        try {
            var dt = new Date(d); if (isNaN(dt)) return '';
            var pad = function (n) { return String(n).padStart(2, '0'); };
            return pad(dt.getDate()) + '/' + pad(dt.getMonth() + 1) + '/' + dt.getFullYear()
                + ' ' + pad(dt.getHours()) + ':' + pad(dt.getMinutes());
        } catch (e) { return ''; }
    }
    function formatIssueType(typeCode, issueName) {
        var c = String(typeCode || '').trim();
        var n = String(issueName || '').trim();
        if (c && n) return c + ' - ' + n;
        return c || n || '—';
    }
    function priorityTextVi(priority) { return (PRIORITY_MAP[priority] && PRIORITY_MAP[priority].vi) || priority || '—'; }
    function priorityBadge(priority) {
        var cls = (PRIORITY_MAP[priority] && PRIORITY_MAP[priority].cls) || 's-secondary';
        return '<span class="status-pill ' + cls + '">' + esc(priorityTextVi(priority)) + '</span>';
    }
    function statusBadge(status) {
        var cls = (STATUS_COLOR_MAP[status] && STATUS_COLOR_MAP[status].cls) || 's-pending';
        return '<span class="status-pill ' + cls + '">' + esc(status || '') + '</span>';
    }
    function statusColor(status) { return (STATUS_COLOR_MAP[status] && STATUS_COLOR_MAP[status].color) || '#7e8796'; }
    function statusBg(status) { return (STATUS_COLOR_MAP[status] && STATUS_COLOR_MAP[status].bg) || '#f1f3f7'; }
    function driveThumb(url, w) {
        if (!url) return url;
        var m = String(url).match(/[?&]id=([^&]+)/);
        if (!m) return url;
        return 'https://drive.google.com/thumbnail?id=' + m[1] + '&sz=w' + (w || 400);
    }
    function firstImg(urls) {
        if (!urls) return '';
        var arr = String(urls).split('|').map(function (s) { return s.trim(); }).filter(Boolean);
        return arr[0] || '';
    }
    function splitUrls(urls) {
        if (!urls) return [];
        return String(urls).split('|').map(function (s) { return s.trim(); }).filter(Boolean);
    }
    function safeBind(id, event, handler) {
        var el = document.getElementById(id);
        if (el && typeof el.addEventListener === 'function') { el.addEventListener(event, handler); return true; }
        return false;
    }
    function debounce(fn, wait) {
        var t;
        return function () { var ctx = this, args = arguments; clearTimeout(t); t = setTimeout(function () { fn.apply(ctx, args); }, wait); };
    }
    function throttle(fn, wait) {
        var last = 0;
        return function () { var now = Date.now(); if (now - last >= wait) { last = now; fn.apply(this, arguments); } };
    }
    function deepClone(obj) { return JSON.parse(JSON.stringify(obj || null)); }
    function isFresh(cacheItem, ttl) { return !!(cacheItem && (Date.now() - cacheItem.at < ttl)); }

    /* ═══════════════════════════════════════════════════
       CACHE HELPERS
    ═══════════════════════════════════════════════════ */
    function getPageCacheKey(page) {
        return [
            page,
            APP.user ? APP.user.username : 'anon',
            page === 'dashboard' ? getActiveDashboardRange() : '',
            page === 'dashboard' ? getDashFactory() : ''
        ].join('|');
    }
    function setPageCache(page, data) { APP.cache.pages[getPageCacheKey(page)] = { at: Date.now(), data: deepClone(data) }; }
    function getPageCache(page) { return APP.cache.pages[getPageCacheKey(page)] || null; }

    /* ═══════════════════════════════════════════════════
       CLOCK
    ═══════════════════════════════════════════════════ */
    var _clockRafId = null;
    var _lastClockSec = -1;

    function _clockTick() {
        if (!document.hidden) {
            var now = new Date();
            var sec = now.getSeconds();
            if (sec !== _lastClockSec) {
                _lastClockSec = sec;
                var el = document.getElementById('currentDateTime');
                if (el) el.textContent = now.toLocaleString('vi-VN');
            }
        }
        _clockRafId = requestAnimationFrame(_clockTick);
    }
    function _startClock() { if (_clockRafId) cancelAnimationFrame(_clockRafId); _clockTick(); }
    function _stopClock() { if (_clockRafId) { cancelAnimationFrame(_clockRafId); _clockRafId = null; } }

    /* ═══════════════════════════════════════════════════
       LOADER / TOAST / ERROR
    ═══════════════════════════════════════════════════ */
    var _loaderTimer = null;
    var _loaderVisible = false;

    function showLoader(msg, mode) {
        clearTimeout(_loaderTimer);
        mode = mode || 'soft';
        _loaderTimer = setTimeout(function () {
            var l = document.getElementById('globalLoader');
            if (!l) return;
            _loaderVisible = true;
            l.style.display = 'flex';
            l.classList.toggle('loader-hard', mode === 'hard');
            var m = l.querySelector('.loader-msg');
            if (m) m.textContent = msg || 'Đang xử lý...';
        }, mode === 'hard' ? 0 : 250);
    }
    function hideLoader() {
        clearTimeout(_loaderTimer);
        _loaderTimer = null;
        if (!_loaderVisible) return;
        _loaderVisible = false;
        var l = document.getElementById('globalLoader');
        if (!l) return;
        l.style.display = 'none';
        l.classList.remove('loader-hard');
    }
    function toast(msg, type) { showToast(msg, type); }
    function showToast(msg, type) {
        type = type || 'info';
        var c = document.getElementById('toastContainer'); if (!c) return;
        var icons = { success: 'check-circle', danger: 'times-circle', warning: 'exclamation-triangle', info: 'info-circle' };
        var t = document.createElement('div');
        t.className = 'toast-app toast-' + type;
        t.innerHTML = '<i class="fas fa-' + (icons[type] || 'info-circle') + ' toast-icon"></i>'
            + '<span class="toast-message">' + esc(msg) + '</span>'
            + '<button class="toast-close" onclick="this.parentElement.remove()"><i class="fas fa-times"></i></button>';
        c.appendChild(t);
        setTimeout(function () {
            t.style.opacity = '0';
            setTimeout(function () { if (t && t.parentNode) t.remove(); }, 300);
        }, 3800);
    }
    function handleServerError(err) {
        hideLoader();
        showToast('Lỗi server: ' + (err && err.message ? err.message : err), 'danger');
    }

    /* ═══════════════════════════════════════════════════
       MODAL / DIALOG
    ═══════════════════════════════════════════════════ */
    function openModal(id) {
        var el = document.getElementById(id); if (!el) return;
        if (typeof bootstrap === 'undefined' || !bootstrap.Modal) return;
        try { bootstrap.Modal.getOrCreateInstance(el).show(); } catch (e) { }
    }
    function closeModal(id) {
        var el = document.getElementById(id); if (!el) return;
        if (typeof bootstrap === 'undefined' || !bootstrap.Modal) return;
        try { var m = bootstrap.Modal.getInstance(el); if (m) m.hide(); } catch (e) { }
    }
    function confirmAction(title, message, callback, opts) {
        opts = opts || {};
        setText('confirmTitle', title || 'Xác nhận');
        setText('confirmMessage', message || '');
        var okTextEl = document.getElementById('confirmOkText');
        if (okTextEl) okTextEl.textContent = opts.okText || 'Xác nhận';
        var oldBtn = document.getElementById('confirmOkBtn'); if (!oldBtn) return;
        var newBtn = oldBtn.cloneNode(true);
        oldBtn.parentNode.replaceChild(newBtn, oldBtn);
        newBtn.className = 'btn-app ' + (opts.safe ? 'btn-primary-app' : 'btn-danger-app');
        newBtn.onclick = function () { closeModal('confirmModal'); if (typeof callback === 'function') callback(); };
        openModal('confirmModal');
    }
    function promptModal(opts, callback) {
        opts = opts || {};
        var title = opts.title || 'Nhập nội dung';
        var desc = opts.desc || '';
        var label = opts.label || 'Nội dung';
        var placeholder = opts.placeholder || 'Nhập tại đây...';
        var okText = opts.okText || 'Xác nhận';
        var required = opts.required !== false;
        var defVal = opts.defaultValue || '';
        var danger = !!opts.danger;
        var icon = opts.icon || 'fa-comment-dots';

        setText('reasonTitle', title);
        var descEl = document.getElementById('reasonDesc');
        if (descEl) descEl.innerHTML = desc;
        setText('reasonOkText', okText);
        var iconEl = document.getElementById('reasonIcon');
        if (iconEl) iconEl.className = 'fas ' + icon;
        var labelEl = document.getElementById('reasonLabel');
        if (labelEl) labelEl.innerHTML = '<i class="fas fa-pen"></i> ' + esc(label);
        var input = document.getElementById('reasonInput');
        if (input) { input.value = defVal; input.placeholder = placeholder; }

        var okBtn = document.getElementById('reasonOkBtn'); if (!okBtn) return;
        var newBtn = okBtn.cloneNode(true);
        okBtn.parentNode.replaceChild(newBtn, okBtn);
        newBtn.className = 'btn-app ' + (danger ? 'btn-danger-app' : 'btn-primary-app');
        var okTextSpan = document.getElementById('reasonOkText');
        if (okTextSpan) okTextSpan.textContent = okText;
        newBtn.onclick = function () {
            var val = (input ? input.value : '').trim();
            if (required && !val) { showToast('Vui lòng nhập nội dung', 'warning'); if (input) input.focus(); return; }
            closeModal('reasonModal');
            if (typeof callback === 'function') callback(val);
        };
        openModal('reasonModal');
        setTimeout(function () { if (input) input.focus(); }, 350);
    }

    /* ═══════════════════════════════════════════════════
       INIT
    ═══════════════════════════════════════════════════ */
    document.addEventListener('DOMContentLoaded', function () {
        APP.currentView = window.innerWidth <= 768 ? 'card' : (lsGet('gembaViewMode') || 'table');
        APP.sidebarCollapsed = lsGet('gembaSidebarCollapsed') === '1';

        bindGlobalResponsive();
        bindGlobalNotifEvents();
        initLogin();
        _startClock();

        var _detailModal = document.getElementById('gembaDetailModal');
        if (_detailModal) {
            _detailModal.addEventListener('hidden.bs.modal', function () {
                APP.uploads.afterImages = [];
                APP.uploads.editImages = [];
            });
        }

        var _createModal = document.getElementById('createGembaModal');
        if (_createModal) {
            _createModal.addEventListener('hidden.bs.modal', function () {
                APP.uploads.images = [];
                APP.uploads.video = [];
                APP.uploads.files = [];
            });
        }
        ['cCameraPhoto', 'cCameraVideo'].forEach(function (id) {
            var el = document.getElementById(id);
            if (!el) return;
            el.addEventListener('change', function (e) {
                var files = Array.from(e.target.files || []);
                if (!files.length) return;

                // Cách 1 (khuyên dùng): gọi thẳng hàm đang xử lý cAllFiles
                // handleCreateFiles(files);   // ← đổi thành tên hàm thật trong Script

                // Cách 2: nếu không tách được hàm, đẩy file sang cAllFiles và kích hoạt sự kiện change
                var dt = new DataTransfer();
                files.forEach(function (f) { dt.items.add(f); });
                var all = document.getElementById('cAllFiles');
                all.files = dt.files;
                all.dispatchEvent(new Event('change', { bubbles: true }));

                e.target.value = ''; // cho phép chụp lại lần nữa
            });
        });
    });

    document.addEventListener('visibilitychange', function () {
        if (document.hidden) {
            _stopClock();
            stopNotifPoll();
            stopHeartbeat();
        } else {
            _startClock();
            if (APP.user) {
                startNotifPoll();
                startHeartbeat();
                setTimeout(refreshNotifications, 600);
            }
        }
    });

    /* ═══════════════════════════════════════════════════
       RESPONSIVE / GLOBAL EVENTS
    ═══════════════════════════════════════════════════ */
    function bindGlobalResponsive() {
        window.addEventListener('resize', debounce(function () {
            syncResponsiveViewMode();
            applySidebarState();
        }, 200));

        document.addEventListener('click', function (e) {
            var sidebar = document.getElementById('sidebar');
            var backdrop = document.getElementById('sidebarBackdrop');
            if (!sidebar || !backdrop || window.innerWidth > 768) return;
            if (!sidebar.contains(e.target) && !(e.target.closest && e.target.closest('.btn-menu-toggle'))) {
                sidebar.classList.remove('mobile-open');
                backdrop.classList.remove('show');
            }
        });
    }

    function bindGlobalNotifEvents() {
        document.addEventListener('input', function (e) {
            if (e.target && (e.target.id === 'notifReceiverSearch' || e.target.id === 'notifReceiverFilter'))
                renderNotifRecipients();
            if (e.target && e.target.id === 'tokenManualInput') {
                var v = e.target.value.toUpperCase().replace(/[^0-9A-F]/g, '');
                if (v !== e.target.value) e.target.value = v;
            }
        });
        document.addEventListener('change', function (e) {
            if (e.target && e.target.id === 'notifReceiverFilter') renderNotifRecipients();
            if (e.target && e.target.id === 'tokenManualInput') {
                var v = e.target.value.toUpperCase().replace(/[^0-9A-F]/g, '');
                if (v !== e.target.value) e.target.value = v;
            }
        });
    }

    /* ═══════════════════════════════════════════════════
       AUTH HELPERS
    ═══════════════════════════════════════════════════ */
    function _canViewDashboard(role) { return ['Admin', 'Tổng Giám đốc', 'Giám đốc', 'Trưởng Line', 'Tổ trưởng'].indexOf(String(role || '')) >= 0; }
    function _canManage(role) { return ['Admin', 'Tổng Giám đốc', 'Giám đốc', 'Trưởng Line'].indexOf(String(role || '')) >= 0; }
    function _isAdmin(role) { return String(role || '') === 'Admin'; }
    function _isVpGroup(group) { var g = String(group || '').trim().toLowerCase(); return g === 'vp chuỗi' || g === 'vp chuoi' || g === 'vp khu vực' || g === 'vp khu vuc'; }

    /* ═══════════════════════════════════════════════════
       LOGIN
    ═══════════════════════════════════════════════════ */
    function initLogin() {
        var savedToken = lsGet('gembaToken');
        if (savedToken) {
            showLoader('Đang khôi phục phiên...', 'hard');
            google.script.run
                .withSuccessHandler(function (res) {
                    hideLoader();
                    if (res && res.success && res.user) {
                        APP.user = res.user;
                        APP.appVersion = res.appVersion || '1';
                        lsSet('gembaAppVersion', APP.appVersion);
                        showToast('Chào mừng trở lại, ' + res.user.fullName + '!', 'success');
                        showMainAppInstant();
                        var startPage = _canViewDashboard(res.user.role) ? 'dashboard' : 'gemba';
                        setTimeout(function () { loadBootstrapPage(startPage, { firstLoad: true, showLoader: true }); }, 300);
                        startHeartbeat();
                    } else {
                        if (res && res.killed) showLoginError('⚠ Hệ thống đang bảo trì. Vui lòng thử lại sau.');
                        lsRemove('gembaToken');
                        _initLoginForm();
                    }
                })
                .withFailureHandler(function () { hideLoader(); _initLoginForm(); })
                .loginByToken(savedToken);
        } else {
            _initLoginForm();
        }
    }

    function _initLoginForm() {
        google.script.run
            .withSuccessHandler(function (groups) {
                var html = '<option value="">-- Chọn nhóm --</option>'
                    + (groups || []).map(function (g) { return '<option value="' + esc(g) + '">' + esc(g) + '</option>'; }).join('');
                var s1 = document.getElementById('loginGroup');
                var s2 = document.getElementById('regGroup');
                if (s1) s1.innerHTML = html;
                if (s2) s2.innerHTML = html;
            })
            .withFailureHandler(handleServerError)
            .getLoginGroups();

        safeBind('loginGroup', 'change', function () { _resetUserAndPassword(); if (this.value) loadUsersForGroup(this.value); });
        safeBind('loginUsername', 'change', _togglePasswordAndSubmit);
        safeBind('loginPassword', 'input', _toggleSubmit);
        safeBind('loginForm', 'submit', function (e) { e.preventDefault(); handleLogin(); });
        safeBind('registerForm', 'submit', function (e) { e.preventDefault(); handleRegister(); });
        _resetUserAndPassword();
    }

    function _resetUserAndPassword() {
        var userSel = document.getElementById('loginUsername');
        var pwdInput = document.getElementById('loginPassword');
        var hint = document.getElementById('loginUserHint');
        if (userSel) { userSel.innerHTML = '<option value="">⬆ Vui lòng chọn nhóm trước</option>'; userSel.disabled = true; userSel.value = ''; }
        if (pwdInput) { pwdInput.disabled = true; pwdInput.value = ''; }
        if (hint) hint.innerHTML = '<i class="fas fa-info-circle"></i> Danh sách người dùng sẽ hiện sau khi chọn nhóm';
        _toggleSubmit();
    }

    function _togglePasswordAndSubmit() {
        var sel = document.getElementById('loginUsername');
        var pwd = document.getElementById('loginPassword');
        var has = sel && sel.value;
        if (pwd) { pwd.disabled = !has; if (!has) pwd.value = ''; else setTimeout(function () { pwd.focus(); }, 50); }
        _toggleSubmit();
    }

    function _toggleSubmit() {
        var btn = document.getElementById('loginSubmitBtn');
        var grp = document.getElementById('loginGroup');
        var usr = document.getElementById('loginUsername');
        var pwd = document.getElementById('loginPassword');
        if (!btn) return;
        btn.disabled = !(grp && grp.value && usr && usr.value && pwd && pwd.value);
    }

    function loadUsersForGroup(group, preselectUser) {
        var sel = document.getElementById('loginUsername');
        var hint = document.getElementById('loginUserHint');
        if (!group) { _resetUserAndPassword(); return; }
        sel.disabled = true;
        sel.innerHTML = '<option value="">⏳ Đang tải...</option>';
        if (hint) hint.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Đang tải...';

        google.script.run
            .withSuccessHandler(function (users) {
                if (!users || !users.length) {
                    sel.innerHTML = '<option value="">(Nhóm này chưa có người dùng)</option>';
                    sel.disabled = true;
                    if (hint) hint.innerHTML = '<i class="fas fa-exclamation-circle text-warning"></i> Nhóm không có người dùng.';
                    return;
                }
                sel.innerHTML = '<option value="">-- Chọn người dùng --</option>'
                    + users.map(function (u) { return '<option value="' + esc(u.username) + '">' + esc(u.username) + '</option>'; }).join('');
                sel.disabled = false;
                if (hint) hint.innerHTML = '<i class="fas fa-check-circle text-success"></i> Đã tải ' + users.length + ' người dùng';
                if (preselectUser) { sel.value = preselectUser; _togglePasswordAndSubmit(); }
            })
            .withFailureHandler(function (err) { sel.innerHTML = '<option value="">(Lỗi tải)</option>'; handleServerError(err); })
            .getUsersByGroup(group);
    }

    function handleLogin() {
        var group = document.getElementById('loginGroup').value;
        var username = document.getElementById('loginUsername').value;
        var password = document.getElementById('loginPassword').value;
        var remember = document.getElementById('rememberMe').checked;

        if (!group) { showLoginError('Vui lòng chọn Nhóm đăng nhập'); return; }
        if (!username) { showLoginError('Vui lòng chọn Người dùng'); return; }
        if (!password) { showLoginError('Vui lòng nhập Mật khẩu'); return; }

        showLoader('Đang đăng nhập...', 'hard');
        google.script.run
            .withSuccessHandler(function (res) {
                hideLoader();
                if (!res.success) { showLoginError(res.message || 'Sai thông tin đăng nhập'); return; }
                APP.user = res.user;
                APP.appVersion = res.appVersion || '1';
                if (res.token && remember) lsSet('gembaToken', res.token);
                lsSet('gembaAppVersion', APP.appVersion);
                showToast('Đăng nhập thành công!', 'success');
                showMainAppInstant();
                var startPage = _canViewDashboard(res.user.role) ? 'dashboard' : 'gemba';
                setTimeout(function () { loadBootstrapPage(startPage, { firstLoad: true, showLoader: true }); }, 300);
                startHeartbeat();
            })
            .withFailureHandler(handleServerError)
            .loginByGroup(group, username, password, navigator.userAgent || '');
    }

    function handleLogout() {
        confirmAction('Đăng xuất', 'Bạn chắc chắn muốn đăng xuất?', function () {
            var token = lsGet('gembaToken');
            if (token) {
                google.script.run.withSuccessHandler(function () { }).withFailureHandler(function () { }).logoutToken(token);
            }
            lsRemove('gembaToken');
            lsRemove('gembaLogin');
            lsRemove('gembaAppVersion');

            stopNotifPoll();
            stopHeartbeat();
            _stopClock();

            APP.user = null;
            APP.permissions = {};
            APP.cache = { pages: {}, detail: {}, users: { at: 0, data: null } };
            APP.notifications = [];
            APP.gembaList = [];
            APP.filteredGemba = [];
            APP.userList = [];

    function onRegGroupChange() {
        var group = document.getElementById('regGroup').value;
        var factoryBlock = document.getElementById('regFactoryBlock');
        var vpNotice = document.getElementById('regVpNotice');
        var facInput = document.getElementById('regFactory');
        var lineSel = document.getElementById('regLine');
        var toSel = document.getElementById('regTo');

        if (facInput) facInput.value = '';
        if (lineSel) { lineSel.innerHTML = '<option value="">-- Chọn --</option>'; lineSel.disabled = true; lineSel.value = ''; }
        if (toSel) { toSel.innerHTML = '<option value="">-- Chọn Line trước --</option>'; toSel.disabled = true; toSel.value = ''; }

        if (!group) { factoryBlock.style.display = 'none'; vpNotice.style.display = 'none'; return; }
        if (_isVpGroup(group)) { factoryBlock.style.display = 'none'; vpNotice.style.display = 'flex'; return; }

        factoryBlock.style.display = 'block';
        vpNotice.style.display = 'none';
        if (facInput) facInput.value = group;

        var meta = APP.metadata || {};
        var lines = (meta.linesByFactory || {})[group] || [];
        if (!lines.length) { lineSel.innerHTML = '<option value="">(Chưa có Line)</option>'; lineSel.disabled = true; return; }
        lineSel.innerHTML = '<option value="">-- Chọn Line --</option>'
            + lines.map(function (l) { return '<option value="' + esc(l) + '">' + esc(l) + '</option>'; }).join('');
        lineSel.disabled = false;
        if (lineSel.dataset.bound !== '1') { lineSel.dataset.bound = '1'; lineSel.addEventListener('change', onRegLineChange); }
    }

    function onRegLineChange() {
        var fac = document.getElementById('regFactory').value;
        var line = document.getElementById('regLine').value;
        var toSel = document.getElementById('regTo');
        toSel.innerHTML = '<option value="">-- Chọn Tổ --</option>'; toSel.disabled = true; toSel.value = '';
        if (!fac || !line) { toSel.innerHTML = '<option value="">-- Chọn Line trước --</option>'; return; }
        var meta = APP.metadata || {};
        var tos = (meta.toByLine || {})[fac + '||' + line] || [];
        if (!tos.length) { toSel.innerHTML = '<option value="">(Chưa có Tổ)</option>'; return; }
        toSel.innerHTML = '<option value="">-- Chọn Tổ --</option>'
            + tos.map(function (t) { return '<option value="' + esc(t) + '">' + esc(t) + '</option>'; }).join('');
        toSel.disabled = false;

    function handleRegister() {
        var username = ((document.getElementById('regUsername') || {}).value || '').trim();
        var fullName = ((document.getElementById('regFullName') || {}).value || '').trim();
        var email = ((document.getElementById('regEmail') || {}).value || '').trim().toLowerCase();
        var group = ((document.getElementById('regGroup') || {}).value || '').trim();
        var phone = ((document.getElementById('regPhone') || {}).value || '').trim();

        if (!username) return showLoginError('Vui lòng nhập tên đăng nhập');
        if (!/^[a-zA-Z0-9._-]{3,30}$/.test(username)) return showLoginError('Username 3-30 ký tự, chỉ được dùng: chữ, số, dấu chấm (.), gạch dưới (_), gạch ngang (-)');
        if (!fullName) return showLoginError('Vui lòng nhập họ và tên');
        if (fullName.length < 3) return showLoginError('Họ tên phải ít nhất 3 ký tự');
        if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return showLoginError('Email không hợp lệ — vui lòng nhập đúng định dạng');
        if (!group) return showLoginError('Vui lòng chọn Nhóm đăng nhập');

        var factory = '', line = '', to = '';

        if (_isVpGroup(group)) {
            factory = ''; line = ''; to = '';
        } else {
            factory = group;
            line = ((document.getElementById('regLine') || {}).value || '').trim();
            to = ((document.getElementById('regTo') || {}).value || '').trim();
            if (!line) return showLoginError('Vui lòng chọn Line sản xuất');
            if (!to) return showLoginError('Vui lòng chọn Tổ sản xuất');
        }

        var submitBtn = document.getElementById('registerSubmitBtn');
        if (submitBtn) { submitBtn.disabled = true; submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> <span>Đang xử lý...</span>'; }

        showLoader('Đang đăng ký tài khoản...', 'hard');
        google.script.run
            .withSuccessHandler(function (res) {
                hideLoader();
                if (submitBtn) { submitBtn.disabled = false; submitBtn.innerHTML = '<i class="fas fa-user-plus"></i> <span>Đăng ký tài khoản</span>'; }
                if (!res || !res.success) { showLoginError((res && res.message) || 'Đăng ký thất bại. Vui lòng thử lại.'); return; }
                showToast(res.message || 'Đăng ký thành công! Kiểm tra email để lấy mật khẩu.', 'success');
                if (!res.emailSent) showToast('Không gửi được email tự động. Vui lòng liên hệ Admin để lấy mật khẩu.', 'warning');
                var form = document.getElementById('registerForm'); if (form) form.reset();
                var factoryBlock = document.getElementById('regFactoryBlock');
                var vpNotice = document.getElementById('regVpNotice');
                if (factoryBlock) factoryBlock.style.display = 'none';
                if (vpNotice) vpNotice.style.display = 'none';
                setTimeout(function () {
                    switchAuthTab('login');
                    var loginGroupSel = document.getElementById('loginGroup');
                    if (loginGroupSel) { loginGroupSel.value = group; loadUsersForGroup(group, username); }
                    showToast('Vui lòng kiểm tra email để lấy mật khẩu và đăng nhập.', 'info');
                }, 2000);
            })
            .withFailureHandler(function (err) {
                hideLoader();
                if (submitBtn) { submitBtn.disabled = false; submitBtn.innerHTML = '<i class="fas fa-user-plus"></i> <span>Đăng ký tài khoản</span>'; }
                var msg = (err && err.message) ? err.message : String(err || '');
                showLoginError('Lỗi hệ thống: ' + msg + '. Vui lòng thử lại sau.');
            })
            .registerUser({ username, fullName, email, group, factory, line, to, phone });
    }

    function navigateTo(page, opts) {
        opts = opts || {};
        if (page === 'kpi' && APP.permissions &&
            !APP.permissions.canViewDashboard) page = 'gemba';
        if (page === 'dashboard' && APP.permissions && !APP.permissions.canViewDashboard) page = 'gemba';
        if (page === 'users' && APP.permissions && !APP.permissions.isAdmin) page = 'gemba';
        if (!opts.silent && page === 'gemba' && !window._navFromTree) clearGembaFilters();
        window._navFromTree = false;
        APP.currentPage = page;

        requestAnimationFrame(function () {
            document.querySelectorAll('.app-page').forEach(function (p) { p.style.display = 'none'; });
            var target = document.getElementById('page-' + page);
            if (target) target.style.display = 'block';
            document.querySelectorAll('.nav-item').forEach(function (n) { n.classList.remove('active'); });
            var act = document.querySelector('.nav-item[data-page="' + page + '"]');
            if (act) act.classList.add('active');
        });

        var titles = {
            analytics: ['Phân tích Gemba',
                '<i class="fas fa-home"></i> / Phân tích Gemba'],

            kpi: ['Báo cáo KPI', '<i class="fas fa-home"></i> / KPI'],
            dashboard: ['Dashboard', '<i class="fas fa-home"></i> Tổng quan'],
            gemba: ['Quản lý Gemba', '<i class="fas fa-home"></i> / Gemba'],
            mytasks: ['Việc của tôi', '<i class="fas fa-home"></i> / Tasks'],
            users: ['Quản lý User', '<i class="fas fa-home"></i> / Users'],
            account: ['Tài khoản', '<i class="fas fa-home"></i> / Account']
        };
        if (titles[page]) { setText('pageTitle', titles[page][0]); document.getElementById('pageBreadcrumb').innerHTML = titles[page][1]; }

        var sidebar = document.getElementById('sidebar');
        var backdrop = document.getElementById('sidebarBackdrop');
        if (sidebar) sidebar.classList.remove('mobile-open');
        if (backdrop) backdrop.classList.remove('show');

        if (opts.silent) return;
        switch (page) {
            case 'analytics':
                if (typeof loadAnalytics === 'function') loadAnalytics(); break;
            case 'kpi':
                if (typeof loadKpi === 'function') loadKpi(); break;
            case 'dashboard': case 'gemba': case 'mytasks': loadBootstrapPage(page, { showLoader: false }); break;

    /* ═══════════════════════════════════════════════════
       BOOTSTRAP DATA
    ═══════════════════════════════════════════════════ */
    function loadBootstrapPage(page, opts) {
        opts = opts || {};
        var ttl = CACHE_TTL[page] || 60000;
        var cached = !opts.force ? getPageCache(page) : null;

        if (cached) {
            applyBootstrapData(cached.data || {}, page, Object.assign({}, opts, { fromCache: true }));
            if (isFresh(cached, ttl) && !opts.force) return;
            opts.showLoader = false;
            opts.background = true;
        }

        if (page === 'dashboard' && !cached && APP.lastDashSnapshot) {
            applyBootstrapData({ dashboard: APP.lastDashSnapshot }, 'dashboard', { fromCache: true, background: true });
            opts.showLoader = false;
            opts.background = true;
        }

        var show = opts.showLoader === true || (!cached && opts.showLoader !== false && !opts.background);
        if (show) {
            showLoader(
                opts.firstLoad ? 'Đang tải dữ liệu...' :
                    page === 'dashboard' ? 'Đang tải dashboard...' :
                        page === 'gemba' ? 'Đang tải danh sách...' : 'Đang tải dữ liệu...',
                'soft'
            );
        }

        var myReqId = null;
        if (page === 'dashboard') { APP.dashReqId = (APP.dashReqId || 0) + 1; myReqId = APP.dashReqId; }
        _doLoadBootstrap(page, opts, cached, show, opts.firstLoad ? 3 : 2, myReqId);
    }

    function _doLoadBootstrap(page, opts, cached, show, retriesLeft, reqId) {
        function isStale() { return page === 'dashboard' && reqId != null && reqId !== APP.dashReqId; }

        google.script.run
            .withSuccessHandler(function (res) {
                if (isStale()) { if (show) hideLoader(); return; }
                if (!res || !res.success) {
                    if (retriesLeft > 0) { setTimeout(function () { if (!isStale()) _doLoadBootstrap(page, opts, cached, show, retriesLeft - 1, reqId); }, 900); return; }
                    if (show) hideLoader();
                    if (!cached && !(page === 'dashboard' && APP.lastDashSnapshot)) {
                        showToast((res && res.message) || 'Đang kết nối lại...', 'warning');
                        setTimeout(function () { if (!isStale()) loadBootstrapPage(page, { force: true, showLoader: false, background: true }); }, 3000);
                    }
                    return;
                }
                if (show) hideLoader();
                applyBootstrapData(res.data || {}, page, opts);
                setPageCache(page, res.data || {});
                if (page === 'dashboard' && res.data && res.data.dashboard) APP.lastDashSnapshot = deepClone(res.data.dashboard);
            })
            .withFailureHandler(function () {
                if (isStale()) { if (show) hideLoader(); return; }
                if (retriesLeft > 0) { setTimeout(function () { if (!isStale()) _doLoadBootstrap(page, opts, cached, false, retriesLeft - 1, reqId); }, 1100); return; }
                if (show) hideLoader();
                if (!cached && !(page === 'dashboard' && APP.lastDashSnapshot)) {
                    showToast('Mạng chậm, đang thử lại...', 'warning');
                    setTimeout(function () { if (!isStale()) loadBootstrapPage(page, { force: true, showLoader: false, background: true }); }, 3000);
                }
            })
            .getBootstrapData({ user: APP.user, page: page, range: getActiveDashboardRange(), factory: getDashFactory() });
    }

    function applyBootstrapData(data, page, opts) {
        opts = opts || {};
        if (data.metadata) {
            APP.metadata = data.metadata;
            populateDashFactoryFilter();
            if (data.metadata.branding) applyBrandingToUI(data.metadata.branding);
        }

        if (data.treeStats) {
            APP.treeStats = data.treeStats;
            renderGembaTree(data.treeStats.tree || [], data.treeStats.total || 0, data.treeStats.unfinished || 0);
        }

        updateMyTaskBadge(data.myTasks || []);
        if (data.notifications) applyNotifications(data.notifications, data.unreadCount);

        if (page === 'dashboard' && data.dashboard) {
            renderDashboardKpiAndTable(data.dashboard);
            _idleOrTimeout(function () { renderDashboardChartsLazy(data.dashboard); }, 2000, 80);
        }
        if (page === 'gemba' && data.gembaList) {
            APP.gembaList = preprocessGembaList(data.gembaList);
            _applyFiltersRaf();
        }
        if (page === 'mytasks') renderMyTasks(data.myTasks || []);
    }

    function _idleOrTimeout(fn, idleTimeout, fallbackMs) {
        if (typeof requestIdleCallback === 'function') requestIdleCallback(fn, { timeout: idleTimeout });
        else setTimeout(fn, fallbackMs || 80);
    }

    function renderChartWhenVisible(canvasId, renderFn) {
        var canvas = document.getElementById(canvasId); if (!canvas) return;
        var wrapper = canvas.closest('.chart-wrapper');
        if (!wrapper) { renderFn(); return; }
        var rect = wrapper.getBoundingClientRect();
        if (rect.top < window.innerHeight + 200 && rect.bottom > -200) { wrapper.classList.remove('lazy-pending'); renderFn(); return; }
        if (!('IntersectionObserver' in window)) { wrapper.classList.remove('lazy-pending'); renderFn(); return; }
        var obs = new IntersectionObserver(function (entries) {
            entries.forEach(function (entry) { if (entry.isIntersecting) { wrapper.classList.remove('lazy-pending'); renderFn(); obs.disconnect(); } });
        }, { rootMargin: '100px' });
        obs.observe(wrapper);
    }

    function renderGembaTree(tree, total, unfinished) {
        var container = document.getElementById('navGembaTree'); if (!container) return;
        setNavBadge('navTotalGemba', unfinished || 0);
        if (!tree.length) { container.innerHTML = ''; return; }
        var html = '';
        tree.forEach(function (fac) {
            var facKey = 'f:' + fac.name;
            html += "<div class='tree-node tree-factory' data-tree-key='" + esc(facKey) + "' onclick='toggleTreeChildren(this);filterByTree(\"factory\"," + jsq(fac.name) + ")'><i class='fas fa-chevron-right tree-toggle'></i><i class='fas fa-industry tree-icon'></i><span class='tree-label'>" + esc(fac.name) + "</span>" + renderTreeCount(fac.unfinished || 0) + "</div><div class='tree-children' data-child-of='" + esc(facKey) + "'>";
            (fac.lines || []).forEach(function (ln) {
                var lnKey = 'l:' + fac.name + '|' + ln.name;
                html += "<div class='tree-node tree-line' data-tree-key='" + esc(lnKey) + "' onclick='event.stopPropagation();toggleTreeChildren(this);filterByTree(\"line\"," + jsq(fac.name) + "," + jsq(ln.name) + ")'><i class='fas fa-chevron-right tree-toggle'></i><i class='fas fa-stream tree-icon'></i><span class='tree-label'>" + esc(ln.name) + "</span>" + renderTreeCount(ln.unfinished || 0) + "</div><div class='tree-children' data-child-of='" + esc(lnKey) + "'>";
                (ln.tos || []).forEach(function (to) {
                    var toKey = 't:' + fac.name + '|' + ln.name + '|' + to.name;
                    html += "<div class='tree-node tree-line' data-tree-key='" + esc(toKey) + "' style='padding-left:20px' onclick='event.stopPropagation();toggleTreeChildren(this);filterByTree(\"to\"," + jsq(fac.name) + "," + jsq(ln.name) + "," + jsq(to.name) + ")'><i class='fas fa-chevron-right tree-toggle'></i><i class='fas fa-users tree-icon'></i><span class='tree-label'>" + esc(to.name) + "</span>" + renderTreeCount(to.unfinished || 0) + "</div><div class='tree-children' data-child-of='" + esc(toKey) + "'>";
                    (to.statuses || []).forEach(function (st) {
                        html += "<div class='tree-node' style='padding-left:38px' onclick='event.stopPropagation();filterByStatusFromTree(" + jsq(fac.name) + "," + jsq(ln.name) + "," + jsq(to.name) + "," + jsq(st.name) + ")'><i class='fas fa-circle tree-icon' style='font-size:7px;color:" + statusColor(st.name) + "'></i><span class='tree-label'>" + esc(st.name) + "</span>" + renderTreeStatusCount(st.name, st.count || 0) + "</div>";
                    });
                    html += "</div>";
                });
                html += "</div>";
            });
            html += "</div>";
        });
        container.innerHTML = html;
        _restoreTreeExpanded();   // ← khôi phục trạng thái mở/đóng đã lưu
    }

    function renderTreeCount(n) { n = Number(n || 0); return n > 0 ? "<span class='tree-count'>" + n + "</span>" : ''; }
    function renderTreeStatusCount(status, n) { n = Number(n || 0); return n > 0 ? "<span class='tree-count' style='background:" + statusBg(status) + ";color:" + statusColor(status) + "'>" + n + "</span>" : ''; }
    function setNavBadge(id, count) {
        var el = document.getElementById(id); if (!el) return;
        count = Number(count || 0);
        if (count > 0) { el.textContent = count; el.style.display = 'inline-flex'; } else { el.textContent = ''; el.style.display = 'none'; }
    }
    function updateMyTaskBadge(list) { setNavBadge('navMyTasks', (list || []).length); }
    function toggleTreeChildren(el) {
        var next = el.nextElementSibling;
        if (next && next.classList.contains('tree-children')) {
            var isExpanded = next.classList.toggle('expanded');
            var toggle = el.querySelector('.tree-toggle'); if (toggle) toggle.classList.toggle('expanded');
            // Lưu trạng thái vào bộ nhớ
            var key = el.getAttribute('data-tree-key');
            if (key) {
                if (isExpanded) APP.treeExpandedKeys[key] = true;
                else delete APP.treeExpandedKeys[key];
            }
        }
    }

    function _restoreTreeExpanded() {
        var keys = APP.treeExpandedKeys || {};
        Object.keys(keys).forEach(function (key) {
            if (!keys[key]) return;
            var node = document.querySelector('.tree-node[data-tree-key="' + key.replace(/"/g, '\\"') + '"]');
            var child = document.querySelector('.tree-children[data-child-of="' + key.replace(/"/g, '\\"') + '"]');
            if (child) child.classList.add('expanded');
            if (node) { var t = node.querySelector('.tree-toggle'); if (t) t.classList.add('expanded'); }
        });
    }

    function filterByTree(type, factory, line, to) {
        APP.filters = { factory: '', line: '', to: '', status: '', search: '' };
        APP.currentPage_gemba = 1;
        var txt = '';
        if (type === 'factory') { APP.filters.factory = factory || ''; txt = factory || ''; }
        else if (type === 'line') { APP.filters.factory = factory || ''; APP.filters.line = line || ''; txt = [factory, line].filter(Boolean).join(' / '); }
        else if (type === 'to') { APP.filters.factory = factory || ''; APP.filters.line = line || ''; APP.filters.to = to || ''; txt = [factory, line, to].filter(Boolean).join(' / '); }
        var s = document.getElementById('filterStatus'); if (s) s.value = '';
        document.getElementById('treeFilterChip').style.display = 'inline-flex';
        setText('treeFilterText', txt);
        window._navFromTree = true;
        if (APP.currentPage !== 'gemba') navigateTo('gemba'); else _applyFiltersRaf();
    }

    function filterByStatusFromTree(factory, line, to, status) {
        APP.filters = { factory: factory || '', line: line || '', to: to || '', status: status || '', search: '' };
        APP.currentPage_gemba = 1;
        var s = document.getElementById('filterStatus'); if (s) s.value = status || '';
        document.getElementById('treeFilterChip').style.display = 'inline-flex';
        setText('treeFilterText', [factory, line, to, status].filter(Boolean).join(' / '));
        window._navFromTree = true;
        if (APP.currentPage !== 'gemba') navigateTo('gemba'); else _applyFiltersRaf();

    function clearTreeFilter() {
        APP.filters = { factory: '', line: '', to: '', status: '', search: '' };
        APP.currentPage_gemba = 1;
        var s = document.getElementById('filterStatus'); if (s) s.value = '';

       GEMBA LIST / FILTERS

    var _rafFilterPending = false;
    function _applyFiltersRaf() {
        if (_rafFilterPending) return;
        _rafFilterPending = true;
        requestAnimationFrame(function () { _rafFilterPending = false; applyFilters(); });
    }

    function preprocessGembaList(list) {
        return (list || []).map(function (g) {
            g._createdMs = g.createdAt ? new Date(g.createdAt).getTime() : 0;
            return g;
        });
    }

    function bindGembaFilters() {
        var s = document.getElementById('gembaSearch');
        if (s && s.dataset.bound !== '1') {
            s.dataset.bound = '1';
            s.addEventListener('input', debounce(function () { APP.filters.search = this.value || ''; APP.currentPage_gemba = 1; _applyFiltersRaf(); }, 200));
            s.addEventListener('keydown', function (e) { if (e.key === 'Enter') { APP.filters.search = this.value || ''; APP.currentPage_gemba = 1; _applyFiltersRaf(); } });
        }
        var f = document.getElementById('filterStatus');
        if (f && f.dataset.bound !== '1') {
            f.dataset.bound = '1';
            f.addEventListener('change', function () { APP.filters.status = this.value || ''; APP.currentPage_gemba = 1; _applyFiltersRaf(); });
        }
        var td = document.getElementById('toggleShowDone');
        if (td && td.dataset.bound !== '1') {
            td.dataset.bound = '1';
            APP.showDoneItems = lsGet('gembaShowDone') === '1';
            td.checked = APP.showDoneItems;
            td.addEventListener('change', function () { APP.showDoneItems = this.checked; APP.currentPage_gemba = 1; lsSet('gembaShowDone', this.checked ? '1' : '0'); _applyFiltersRaf(); });
        }
        var ps = document.getElementById('pageSize');
        if (ps && ps.dataset.bound !== '1') {
            ps.dataset.bound = '1';
            var savedSize = parseInt(lsGet('gembaPageSize') || '20', 10);
            APP.pageSize = savedSize; ps.value = String(savedSize);
            ps.addEventListener('change', function () { APP.pageSize = parseInt(this.value, 10) || 20; APP.currentPage_gemba = 1; lsSet('gembaPageSize', String(APP.pageSize)); _applyFiltersRaf(); });
        }
    }

    var REOPEN_DONE_HIDE_DAYS = 7;
    function _shouldHideClosedItem(g) {
        if (g.status === 'Chờ xử lý lại') return false;
        if (g.status === 'Từ chối') return true;
        if (g.status === 'Hoàn thành') {
            var refDate = g.completedAt || g.createdAt;
            if (!refDate) return true;
            return (Date.now() - new Date(refDate).getTime()) / 86400000 > REOPEN_DONE_HIDE_DAYS;
        }
        return false;
    }

    function applyFilters() {
        var f = APP.filters || {};
        var kw = String(f.search || '').toLowerCase().trim();

        var filtered = (APP.gembaList || []).filter(function (g) {
            if (!APP.showDoneItems && !f.status) { if (_shouldHideClosedItem(g)) return false; }
            if (f.factory && g.factory !== f.factory) return false;
            if (f.line && g.line !== f.line) return false;
            if (f.to && g.to !== f.to) return false;
            if (f.status && g.status !== f.status) return false;
            if (kw) {
                var blob = ((g.id || '') + ' ' + (g.title || '') + ' ' + (g.factory || '') + ' ' + (g.line || '') + ' ' + (g.to || '') + ' ' + (g.assigneeFullName || '') + ' ' + (g.description || '')).toLowerCase();
                if (blob.indexOf(kw) < 0) return false;
            }
            return true;
        });

        var SORT_STATUS = { 'Quá hạn': 1, 'Chờ xử lý lại': 2, 'Mới': 3, 'Đang xử lý': 4, 'Hoàn thành': 5, 'Từ chối': 6 };
        var SORT_PRIO = { 'Critical': 1, 'High': 2, 'Medium': 3, 'Low': 4 };

        filtered.sort(function (a, b) {
            var oa = SORT_STATUS[a.status] || 99, ob = SORT_STATUS[b.status] || 99;
            if (oa !== ob) return oa - ob;
            var pa = SORT_PRIO[a.priority] || 99, pb = SORT_PRIO[b.priority] || 99;
            if (pa !== pb) return pa - pb;
            return (b._createdMs || 0) - (a._createdMs || 0);
        });

        APP.filteredGemba = filtered;
        renderGembaInfoBar();
        renderGembaPagination();
        syncResponsiveViewMode();
        if (APP.currentView === 'card') renderGembaCards(); else renderGembaTable();
    }

    function renderGembaInfoBar() {
        var bar = document.getElementById('gembaInfoBar'); if (!bar) return;
        var total = APP.gembaList.length;
        var filtered = APP.filteredGemba.length;
        var counts = { 'Mới': 0, 'Chờ xử lý lại': 0, 'Đang xử lý': 0, 'Quá hạn': 0, 'Hoàn thành': 0, 'Từ chối': 0 };
        APP.gembaList.forEach(function (g) { if (Object.prototype.hasOwnProperty.call(counts, g.status)) counts[g.status]++; });
        var hidden = total - filtered;

        var html = '<span><i class="fas fa-database"></i> Tổng: <strong>' + total + '</strong></span>'
            + '<span class="info-sep"></span>'
            + '<span>Hiển thị: <strong>' + filtered + '</strong></span>';
        if (hidden > 0) html += '<span class="info-sep"></span><span style="color:#94a3b8"><i class="fas fa-eye-slash"></i> Đã ẩn ' + hidden + ' phiếu</span>';
        html += '<span style="flex:1"></span>';
        if (counts['Quá hạn'] > 0) html += '<span class="info-pill" style="color:#d14747;border-color:#fecaca"><i class="fas fa-exclamation-triangle"></i> Quá hạn: ' + counts['Quá hạn'] + '</span>';
        if (counts['Chờ xử lý lại'] > 0) html += '<span class="info-pill" style="color:#c0392b;border-color:#fca5a5;font-weight:800"><i class="fas fa-redo"></i> Chờ xử lý lại: ' + counts['Chờ xử lý lại'] + '</span>';
        if (counts['Mới'] > 0) html += '<span class="info-pill" style="color:#4d85f3;border-color:#bfdbfe"><i class="fas fa-hourglass-half"></i> Mới: ' + counts['Mới'] + '</span>';
        if (counts['Đang xử lý'] > 0) html += '<span class="info-pill" style="color:#d48e19;border-color:#fde68a"><i class="fas fa-spinner"></i> Đang xử lý: ' + counts['Đang xử lý'] + '</span>';
        bar.innerHTML = html;
    }

    function syncResponsiveViewMode(force) {
        var mobile = window.innerWidth <= 768;
        if (mobile) APP.currentView = 'card';
        else if (force) APP.currentView = lsGet('gembaViewMode') || APP.currentView || 'table';
        else if (!APP.currentView) APP.currentView = 'table';

        var cardBtn = document.querySelector('.view-mode-btn[data-view="card"]');
        var tableBtn = document.querySelector('.view-mode-btn[data-view="table"]');
        var cardView = document.getElementById('gembaCardView');
        var tableView = document.getElementById('gembaTableView');
        if (cardBtn) cardBtn.classList.toggle('active', APP.currentView === 'card');
        if (tableBtn) tableBtn.classList.toggle('active', APP.currentView === 'table');
        if (cardView) cardView.style.display = APP.currentView === 'card' ? '' : 'none';
        if (tableView) tableView.style.display = APP.currentView === 'table' ? '' : 'none';
    }

    function setGembaView(view) {
        APP.currentView = window.innerWidth <= 768 ? 'card' : view;
        if (window.innerWidth > 768) lsSet('gembaViewMode', view);
        syncResponsiveViewMode();
        applyFilters();
    }

    function loadGembaList(opts) {
        if (opts && opts.target) opts = {};
        loadBootstrapPage('gemba', opts || { showLoader: false });
    }

    function renderGembaPagination() {
        var c = document.getElementById('gembaPagination'); if (!c) return;
        var totalItems = APP.filteredGemba.length, pageSize = APP.pageSize || 20;
        var totalPages = Math.max(1, Math.ceil(totalItems / pageSize));
        var current = Math.min(APP.currentPage_gemba || 1, totalPages);
        APP.currentPage_gemba = current;
        if (totalPages <= 1) { c.innerHTML = ''; return; }
        var html = '<button ' + (current === 1 ? 'disabled' : '') + ' onclick="gotoGembaPage(' + (current - 1) + ')"><i class="fas fa-chevron-left"></i></button>';
        if (current > 3) { html += '<button onclick="gotoGembaPage(1)">1</button>'; if (current > 4) html += '<span class="page-info">...</span>'; }
        for (var i = Math.max(1, current - 2); i <= Math.min(totalPages, current + 2); i++) html += '<button class="' + (i === current ? 'active' : '') + '" onclick="gotoGembaPage(' + i + ')">' + i + '</button>';
        if (current < totalPages - 2) { if (current < totalPages - 3) html += '<span class="page-info">...</span>'; html += '<button onclick="gotoGembaPage(' + totalPages + ')">' + totalPages + '</button>'; }
        html += '<button ' + (current === totalPages ? 'disabled' : '') + ' onclick="gotoGembaPage(' + (current + 1) + ')"><i class="fas fa-chevron-right"></i></button>';
        var from = (current - 1) * pageSize + 1, to = Math.min(current * pageSize, totalItems);
        html += '<span class="page-info">' + from + '–' + to + ' / ' + totalItems + '</span>';
        c.innerHTML = html;
    }

    function gotoGembaPage(p) {
        APP.currentPage_gemba = p;
        if (APP.currentView === 'card') renderGembaCards(); else renderGembaTable();
        renderGembaPagination();
        var target = APP.currentView === 'card' ? document.getElementById('gembaCardContainer') : document.getElementById('gembaTableView');
        if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function getCurrentPageItems() {
        var pageSize = APP.pageSize || 20, current = APP.currentPage_gemba || 1;
        return APP.filteredGemba.slice((current - 1) * pageSize, current * pageSize);
    }

    function renderGembaCards() {
        var c = document.getElementById('gembaCardContainer'); if (!c) return;
        if (!APP.filteredGemba.length) {
            c.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:48px;color:#98a3b3"><i class="fas fa-inbox" style="font-size:2.8rem;opacity:.35"></i><p style="margin-top:8px;font-size:.88rem">Không có Gemba nào phù hợp</p></div>';
            return;
        }
        c.innerHTML = getCurrentPageItems().map(function (g) {
            var img = driveThumb(firstImg(g.imagesBefore), 500);
            var imgHtml = img
                ? '<img src="' + esc(img) + '" alt="" width="480" height="270" loading="lazy" decoding="async"'
                + ' onerror="this.style.display=\'none\';this.parentNode.innerHTML=\'<div class=&quot;no-img&quot;><i class=&quot;fas fa-image&quot;></i><p style=&quot;font-size:.72rem;margin-top:4px;opacity:.6&quot;>Chưa có ảnh</p></div>\'">'
                : '<div class="no-img"><i class="fas fa-image"></i><p style="font-size:.72rem;margin-top:4px;opacity:.6">Chưa có ảnh</p></div>';
            var typeText = formatIssueType(g.typeCode, g.issueName); if (typeText === '—') typeText = '';
            var extraClass = g.status === 'Chờ xử lý lại' ? ' card-reopen' : '';
            return '<div class="gemba-card-rich' + extraClass + '" onclick=\'openGembaDetail(' + jsq(g.id) + ')\'>'
                + '<div class="gemba-card-img-wrap">' + imgHtml
                + '<div class="gemba-card-status-overlay">' + statusBadge(g.status) + '</div>'
                + '<div class="gemba-card-id-overlay">' + esc(g.id) + '</div>'
                + '</div>'
                + '<div class="gemba-card-body">'
                + (typeText ? '<div class="gemba-card-type">' + esc(truncate(typeText, 60)) + '</div>' : '')
                + '<div class="gemba-card-title">' + esc(g.title || '') + '</div>'
                + '<div class="gemba-card-meta">'
                + '<span class="gemba-card-meta-item"><i class="fas fa-industry"></i>' + esc(g.factory || '') + '</span>'
                + '<span class="gemba-card-meta-item"><i class="fas fa-stream"></i>' + esc(g.line || '') + '</span>'
                + '<span class="gemba-card-meta-item"><i class="fas fa-users"></i>' + esc(g.to || '') + '</span>'
                + '<span class="gemba-card-meta-item"><i class="far fa-clock"></i>' + esc(formatDate(g.createdAt)) + '</span>'
                + '</div>'
                + '</div>'
                + '</div>';
        }).join('');
    }

    function renderGembaTable() {
        var t = document.getElementById('gembaTableBody'); if (!t) return;

                + '<td>' + esc(g.creatorFullName || '') + '</td>'

    function openCreateGembaModal() {
        APP.uploads = { images: [], video: [], files: [], afterImages: [] };
        var form = document.getElementById('createGembaForm'); if (form) form.reset();
        var preview = document.getElementById('cAssigneePreview'); if (preview) preview.style.display = 'none';

        renderUploadPreview('cImagePreview', APP.uploads.images, 'images');
        renderUploadPreview('cVideoPreview', APP.uploads.video, 'video');

    function _populateAssigneeDropdown() {

            }).join('');

    function populateCreateSelects() {
        var meta = APP.metadata || {};
        var fSel = document.getElementById('cFactory');
        var lSel = document.getElementById('cLine');
        var tSel = document.getElementById('cTo');
        var codeSel = document.getElementById('cIssueCode');
        var nameSel = document.getElementById('cIssueName');
        if (!fSel || !lSel || !tSel || !codeSel || !nameSel) return;

        fSel.innerHTML = '<option value="">-- Chọn --</option>'
            + (meta.factories || []).map(function (f) { return '<option value="' + esc(f) + '">' + esc(f) + '</option>'; }).join('');
        lSel.innerHTML = '<option value="">-- Chọn Nhà máy trước --</option>'; lSel.disabled = true;
        tSel.innerHTML = '<option value="">-- Chọn Line trước --</option>'; tSel.disabled = true;

        var categories = meta.issueCategories || meta.gembaTypes || [];
        codeSel.innerHTML = '<option value="">-- Chọn mã --</option>'
            + categories.map(function (c) { return '<option value="' + esc(c.code) + '">' + esc(c.code) + '</option>'; }).join('');
        nameSel.innerHTML = '<option value="">-- Chọn mã trước --</option>'; nameSel.disabled = true;

        codeSel.onchange = function () {
            var code = this.value;
            if (!code) { nameSel.innerHTML = '<option value="">-- Chọn mã trước --</option>'; nameSel.disabled = true; return; }
            var list = (meta.issuesByCategory || {})[code] || [];
            if (!list.length) { nameSel.innerHTML = '<option value="">(Không có)</option>'; nameSel.disabled = true; return; }
            nameSel.innerHTML = '<option value="">-- Chọn --</option>' + list.map(function (it) { return '<option value="' + esc(it.name) + '">' + esc(it.name) + '</option>'; }).join('');
            nameSel.disabled = false;
        };

        fSel.onchange = function () {
            var lines = (meta.linesByFactory || {})[this.value] || [];
            lSel.innerHTML = '<option value="">-- Chọn --</option>' + lines.map(function (l) { return '<option value="' + esc(l) + '">' + esc(l) + '</option>'; }).join('');
            lSel.disabled = !lines.length;
            tSel.innerHTML = '<option value="">-- Chọn Line trước --</option>'; tSel.disabled = true;
            var p = document.getElementById('cAssigneePreview'); if (p) p.style.display = 'none';
        };

        lSel.onchange = function () {
            var key = document.getElementById('cFactory').value + '||' + this.value;
            var tos = (meta.toByLine || {})[key] || [];
            tSel.innerHTML = '<option value="">-- Chọn --</option>' + tos.map(function (t) { return '<option value="' + esc(t) + '">' + esc(t) + '</option>'; }).join('');
            tSel.disabled = !tos.length;
            var p = document.getElementById('cAssigneePreview'); if (p) p.style.display = 'none';
        };

        tSel.onchange = function () {
            var fac = document.getElementById('cFactory').value;
            var ln = document.getElementById('cLine').value;
            var to = this.value;
            var ovr = document.getElementById('cAssigneeOverride'); if (ovr) ovr.value = '';
            if (fac && ln && to) {
                google.script.run
                    .withSuccessHandler(function (a) {
                        var box = document.getElementById('cAssigneePreview'); if (!box) return;
                        if (a && a.username) { setText('cAssigneeName', a.fullName + ' (' + a.username + ')'); box.style.display = 'block'; }
                        else { box.style.display = 'none'; showToast('Chưa cấu hình người phụ trách mặc định', 'warning'); }
                    })
                    .withFailureHandler(function () { var b = document.getElementById('cAssigneePreview'); if (b) b.style.display = 'none'; })
                    .getAssigneeByLineTo(fac, ln, to);
            }
        };

        var ovrSel = document.getElementById('cAssigneeOverride');

    function bindFileInput(inputId, key, previewId) {
        var input = document.getElementById(inputId); if (!input) return;
        if (input._gembaHandler) input.removeEventListener('change', input._gembaHandler);
        input._gembaHandler = function (e) {
            Array.from(e.target.files || []).forEach(function (f) {
                var isVideo = (f.type || '').indexOf('video/') === 0;
                var isImage = (f.type || '').indexOf('image/') === 0;

                function processFile(finalFile) {
                    var maxSize = isVideo ? 35 * 1024 * 1024 : 10 * 1024 * 1024;
                    if (finalFile.size > maxSize) { showToast('File quá lớn: ' + finalFile.name + ' (' + (isVideo ? 'tối đa 35MB' : 'tối đa 10MB') + ')', 'warning'); return; }
                    if (isVideo && finalFile.size > 25 * 1024 * 1024) showToast('Video lớn (' + formatBytes(finalFile.size) + '), upload có thể mất 1-3 phút', 'info');
                    var reader = new FileReader();
                    reader.onload = function (ev) {
                        var raw = ev.target.result || '', base64 = raw.indexOf(',') >= 0 ? raw.split(',')[1] : raw;
                        if (!APP.uploads[key]) APP.uploads[key] = [];
                        APP.uploads[key].push({ name: finalFile.name, type: finalFile.type, data: base64, size: finalFile.size });
                        renderUploadPreview(previewId, APP.uploads[key], key);
                    };
                    reader.onerror = function () { showToast('Lỗi đọc file: ' + finalFile.name, 'danger'); };
                    reader.readAsDataURL(finalFile);
                }

                if (isImage) compressImage(f, 1600, 0.82).then(processFile);
                else processFile(f);
            });
            e.target.value = '';
        };
        input.addEventListener('change', input._gembaHandler);
    }

    function handleMixedCreateFiles(files) {
        files.forEach(function (f) {
            var bucket = getFileBucket(f);
            if (!bucket) { showToast('Định dạng chưa hỗ trợ: ' + f.name, 'warning'); return; }

            function processFile(finalFile) {
                var maxSize = bucket === 'video' ? 35 * 1024 * 1024 : 10 * 1024 * 1024;
                if (finalFile.size > maxSize) {
                    showToast('File quá lớn: ' + finalFile.name + ' (' + (bucket === 'video' ? 'tối đa 35MB' : 'tối đa 10MB') + ')', 'warning');
                    return;
                }
                if (bucket === 'video' && finalFile.size > 25 * 1024 * 1024)
                    showToast('Video lớn (' + formatBytes(finalFile.size) + '), upload có thể mất 1-3 phút', 'info');

                var reader = new FileReader();
                reader.onload = function (ev) {
                    var raw = ev.target.result || '', base64 = raw.indexOf(',') >= 0 ? raw.split(',')[1] : raw;
                    APP.uploads[bucket].push({ name: finalFile.name, type: finalFile.type, data: base64, size: finalFile.size });
                    renderUploadPreview('cImagePreview', APP.uploads.images, 'images');
                    renderUploadPreview('cVideoPreview', APP.uploads.video, 'video');
                    renderUploadPreview('cFilesPreview', APP.uploads.files, 'files');
                };
                reader.onerror = function () { showToast('Lỗi đọc file: ' + finalFile.name, 'danger'); };
                reader.readAsDataURL(finalFile);
            }

            if (bucket === 'images') {
                compressImage(f, 1600, 0.82).then(processFile);
            } else {
                processFile(f);
            }
        });
    }
    function compressImage(file, maxW, quality) {
        return new Promise(function (resolve) {
            try {
                if (!file || String(file.type || '').indexOf('image/') !== 0) return resolve(file);
                var img = new Image();
                img.onload = function () {
                    try {
                        var scale = Math.min(1, (maxW || 1600) / img.width);
                        if (scale >= 1) { URL.revokeObjectURL(img.src); return resolve(file); }
                        var c = document.createElement('canvas');
                        c.width = Math.round(img.width * scale);
                        c.height = Math.round(img.height * scale);
                        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
                        c.toBlob(function (blob) {
                            URL.revokeObjectURL(img.src);
                            if (!blob || blob.size >= file.size) return resolve(file);
                            var newName = file.name.replace(/\.[^.]+$/, '') + '.jpg';
                            resolve(new File([blob], newName, { type: 'image/jpeg' }));
                        }, 'image/jpeg', quality || 0.82);
                    } catch (e) { resolve(file); }
                };
                img.onerror = function () { resolve(file); };
                img.src = URL.createObjectURL(file);
            } catch (e) { resolve(file); }
        });
    }
    function getFileBucket(file) {
        var type = String(file.type || '').toLowerCase();
        if (type.indexOf('image/') === 0) return 'images';
        if (type.indexOf('video/') === 0) return 'video';
        if (/\.(pdf|doc|docx|xls|xlsx)$/i.test(file.name)) return 'files';
        return '';
    }

    function openGembaDetail(id) {
        APP.currentDetailId = id;

        APP.uploads.editImages = [];

        var modalBody = document.querySelector('#gembaDetailModal .modal-body');
        if (modalBody) modalBody.scrollTop = 0;

        var listItem = (APP.gembaList || []).find(function (g) { return g.id === id; });
        if (listItem) {
            var first = firstImg(listItem.imagesBefore);
            if (first) { var pre = new Image(); pre.src = driveThumb(first, 1000); }
        }

        var cached = APP.cache.detail[id];
        if (cached && isFresh(cached, CACHE_TTL.detail)) {
            APP.currentDetail = cached.detail;
            setTimeout(function () {
                try { renderGembaDetail(cached.detail, cached.history || []); }
                catch (e) { renderDetailFallback(cached.detail, e); }
            }, 60);
            return;
        }

        // Render ngay từ dữ liệu list (đủ để xem nội dung), history hiện sau
        if (listItem) {
            APP.currentDetail = listItem;
            setTimeout(function () {

                catch (e) { renderDetailLoading(id); }
            }, 40);
        } else {
            setTimeout(function () { renderDetailLoading(id); }, 60);
        }

        google.script.run
            .withSuccessHandler(function (res) {
                if (!res) { closeModal('gembaDetailModal'); showToast('Không nhận được dữ liệu từ server', 'danger'); return; }
                if (!res.success || !res.detail) { closeModal('gembaDetailModal'); showToast((res && res.message) || 'Không tìm thấy phiếu', 'danger'); return; }
                APP.currentDetail = res.detail;

                try { renderGembaDetail(res.detail, res.history || []); }
                catch (e) { renderDetailFallback(res.detail, e); }
            })
            .withFailureHandler(function (err) { closeModal('gembaDetailModal'); showToast('Lỗi kết nối: ' + (err && err.message ? err.message : String(err || '')), 'danger'); })
            .getGembaDetailBundle(id);
