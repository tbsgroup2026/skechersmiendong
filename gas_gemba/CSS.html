        transition: background var(--t-fast), color var(--t-fast);
    }

    .notif-bell:hover {
        background: var(--border);
        color: var(--brand-primary)
    }

    .notif-badge {
        position: absolute;
        top: -2px;
        right: -2px;
        min-width: 17px;
        height: 17px;
        padding: 0 4px;
        border-radius: 999px;
        background: #ef4444;
        color: #fff;
        font-size: .62rem;
        font-weight: 750;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 2px solid #fff;
        line-height: 1;
    }

    .notif-panel {
        position: absolute;
        top: calc(100% + 8px);
        right: 0;
        width: 355px;
        max-height: 500px;
        display: none;
        flex-direction: column;
        z-index: 1000;
        overflow: hidden;
        background: #fff;
        border: 1px solid var(--border);
        border-radius: var(--r-lg);
        box-shadow: var(--shadow-xl);
        will-change: transform, opacity;
        -webkit-backface-visibility: hidden;
        backface-visibility: hidden;
    }

    .notif-panel.open {
        display: flex
    }

    .notif-panel-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 13px 16px;
        border-bottom: 1px solid var(--border);
        font-size: .93rem;
        color: var(--text-primary);
        background: #fafcfe;
    }

    .notif-panel-head strong {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        font-weight: 750
    }

    .notif-panel-head strong i {
        color: var(--brand-primary)
    }

    .notif-mark-all {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        border: none;
        background: transparent;
        color: var(--brand-primary);
        font-size: .75rem;
        font-weight: 650;
        padding: 5px 9px;
        border-radius: var(--r-xs);
        transition: background var(--t-fast);
    }

    .notif-mark-all:hover {
        background: rgba(91, 168, 127, .08)
    }

    .notif-list {
        flex: 1;
        overflow-y: auto;
        padding: 5px
    }

    .notif-empty {
        padding: 38px 18px;
        text-align: center;
        color: var(--text-muted);
        font-size: .83rem
    }

    .notif-empty i {
        font-size: 1.9rem;
        display: block;
        margin-bottom: 7px;
        opacity: .38
    }

    .notif-empty p {
        margin: 0
    }

    .notif-item {
        position: relative;
        cursor: pointer;
        display: flex;
        align-items: flex-start;
        gap: 9px;
        padding: 11px;
        border-radius: var(--r-sm);
        transition: background var(--t-fast);
    }

    .notif-item:hover {
        background: rgba(91, 168, 127, .04)
    }

    .notif-item-unread {
        background: rgba(91, 168, 127, .05)
    }

    .notif-item-unread::before {
        content: '';
        position: absolute;
        left: 4px;
        top: 17px;
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: var(--brand-primary);
    }

    .notif-item-icon {
        width: 34px;
        height: 34px;
        flex-shrink: 0;
        border-radius: var(--r-xs);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-size: .87rem;
    }

    .notif-type-assigned {
        background: linear-gradient(135deg, #7aa8f0, #5a88d0)
    }

    .notif-type-accepted {
        background: linear-gradient(135deg, #f0b96a, #d4963a)
    }

    .notif-type-completed {
        background: linear-gradient(135deg, #5dbb8f, #3a9a6a)
    }

    .notif-type-rejected {
        background: linear-gradient(135deg, #e88a8a, #c86060)
    }

    .notif-type-reminder {
        background: linear-gradient(135deg, #a89cf0, #8472d0)
    }

    .notif-type-announcement {
        background: linear-gradient(135deg, #7dcfd9, #5aafba)
    }

    .notif-type-info {
        background: linear-gradient(135deg, #94a3b8, #6b7b90)
    }

    .notif-item-body {
        flex: 1;
        min-width: 0
    }

    .notif-item-title {
        margin-bottom: 2px;
        font-weight: 700;
        font-size: .84rem;
        color: var(--text-primary);
        word-break: break-word
    }

    .notif-item-content {
        margin-bottom: 4px;
        font-size: .77rem;
        color: var(--text-secondary);
        line-height: 1.5;
        word-break: break-word
    }

    .notif-item-meta {
        display: flex;
        gap: 9px;
        flex-wrap: wrap;
        font-size: .69rem;
        color: var(--text-muted)
    }

    .notif-item-meta i {
        margin-right: 2px
    }

    .notif-item-del {
        width: 22px;
        height: 22px;
        flex-shrink: 0;
        border: none;
        background: transparent;
        color: var(--text-muted);
        border-radius: 5px;
        opacity: 0;
        font-size: .72rem;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: opacity var(--t-fast), background var(--t-fast);
    }

    .notif-item:hover .notif-item-del {
        opacity: 1
    }

    .notif-item-del:hover {
        background: rgba(232, 138, 138, .10);
        color: var(--danger)
    }

    .notif-recv-actions {
        display: flex;
        gap: 7px;
        align-items: center;
        flex-wrap: wrap;
        margin-bottom: 9px
    }

    .notif-recv-count {
        margin-left: auto;
        font-size: .81rem;
        color: var(--text-secondary)
    }

    .notif-recv-count strong {
        color: var(--brand-primary-dark);
        font-weight: 750
    }

    .notif-recv-list {
        max-height: 270px;
        overflow-y: auto;
        padding: 5px;
        border: 1px solid var(--border);
        border-radius: var(--r-sm);
        background: #fff;
    }

    .notif-recv-item {
        display: flex;
        align-items: center;
        gap: 9px;
        cursor: pointer;
        padding: 7px 9px;
        border-radius: var(--r-xs);
        transition: background var(--t-fast);
    }

    .notif-recv-item:hover {
        background: rgba(91, 168, 127, .04)
    }

    .notif-recv-item input {
        accent-color: var(--brand-primary);
        width: 15px;
        height: 15px;
        flex-shrink: 0
    }

    .notif-recv-avatar {
        width: 28px;
        height: 28px;
        flex-shrink: 0;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 750;
        font-size: .73rem;
        color: #fff;
        background: linear-gradient(135deg, var(--brand-primary), var(--brand-primary-light));
    }

    .notif-recv-meta {
        display: flex;
        flex-direction: column;
        min-width: 0;
        flex: 1
    }

    .notif-recv-meta strong {
        font-size: .83rem;
        color: var(--text-primary);
        font-weight: 650;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis
    }

    .notif-recv-meta small {
        font-size: .7rem;
        color: var(--text-muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis
    }

    /* ════════════════════════════════════════
   SKELETON
════════════════════════════════════════ */
    .skeleton {
        background: #e8edf3;
        border-radius: 6px;
        animation: skeleton-pulse 1.1s ease-in-out infinite alternate;
    }

    @keyframes skeleton-pulse {
        from {
            opacity: 1
        }

        to {
            opacity: .45
        }
    }

    .skeleton-text {
        height: 13px;
        margin: 5px 0
    }

    /* ════════════════════════════════════════
   MOBILE CARDS
════════════════════════════════════════ */
    .mobile-card-list {
        display: none;
        flex-direction: column;
        gap: 9px
    }

    .m-task-card {
        background: #fff;
        border: 1px solid var(--border);
        border-radius: var(--r-md);
        padding: 11px 13px 11px 17px;
        box-shadow: var(--shadow-xs);
        cursor: pointer;
        position: relative;
        overflow: hidden;
        transition: box-shadow var(--t-fast);
        border-left: 4px solid var(--brand-primary);
    }

    .m-task-card:active {
        filter: brightness(.97)
    }
